<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FundOne Demo Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0e14;--card:#151821;--card2:#1a1e2a;--bdr:#252a38;--bdr2:#333a4d;--txt:#e8eaf0;--dim:#8a90a5;--mut:#5a6075;--blue:#4e8cff;--green:#2dd4a0;--red:#f06060;--amber:#f0b040;--purple:#a78bfa;--cyan:#20d0e8;--teal:#14b8a6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.5}
.app{max-width:1440px;margin:0 auto;padding:24px 20px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--bdr);flex-wrap:wrap;gap:12px}
.hdr h1{font-size:24px;font-weight:700}.hdr h1 span{color:var(--teal)}
.hdr p{font-size:13px;color:var(--dim);margin-top:2px}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live-txt{font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.tabs{display:flex;gap:4px;margin-bottom:24px;overflow-x:auto;padding-bottom:4px}
.tab{padding:9px 20px;border:1px solid var(--bdr);background:transparent;color:var(--dim);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;transition:all .2s;white-space:nowrap}
.tab:hover{background:var(--card);color:var(--txt)}.tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn{padding:9px 18px;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-p{background:var(--teal);color:#fff}.btn-p:hover{opacity:.85}
.btn-s{background:transparent;border:1px solid var(--bdr);color:var(--dim)}.btn-s:hover{background:var(--card);color:var(--txt)}
.btn-sm{font-size:12px;padding:6px 12px}
.mg{display:grid;gap:14px;margin-bottom:24px}
.mg5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mg4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.mg3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.mg2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.mc{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:16px;transition:all .2s}
.mc:hover{border-color:var(--bdr2);background:var(--card2)}
.mc-l{font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.mc-v{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600}
.mc-s{font-size:11px;color:var(--mut);margin-top:3px}
.tw{background:var(--card);border:1px solid var(--bdr);border-radius:12px;overflow:hidden}
.ts{overflow-x:auto;max-height:65vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#10131b;padding:10px 12px;text-align:left;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);white-space:nowrap;border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:1}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(37,42,56,.6);white-space:nowrap}
tbody tr:hover{background:var(--card2)}
.cm{font-family:'JetBrains Mono',monospace;font-size:12px}
.trow td{font-weight:700!important;background:#10131b!important;border-top:2px solid var(--teal)!important}
.sec{display:none}.sec.on{display:block}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.sh h2{font-size:17px;font-weight:600}
.badge{font-size:11px;font-family:'JetBrains Mono',monospace;padding:4px 10px;border-radius:20px;background:rgba(20,184,166,.15);color:var(--teal)}
.c-pos{color:var(--green)}.c-neg{color:var(--red)}.c-warn{color:var(--amber)}.c-neut{color:var(--txt)}.c-dim{color:var(--dim)}.c-teal{color:var(--teal)}
.err-msg{background:rgba(240,96,96,.08);border:1px solid rgba(240,96,96,.3);border-radius:10px;padding:16px;color:var(--red);font-size:13px;margin-bottom:20px}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--dim);font-size:14px}
.loading::before{content:"";width:20px;height:20px;border:2px solid var(--bdr);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin-right:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid rgba(37,42,56,.4);text-align:center;color:var(--mut);font-size:12px}
.foot a{color:var(--teal);text-decoration:none}
.insight{background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(240,176,64,.04));border:1px solid rgba(251,191,36,.35);border-left:3px solid var(--amber);border-radius:10px;padding:16px 20px;margin-top:20px;display:flex;gap:14px;align-items:flex-start}
.insight-icon{font-size:20px;flex-shrink:0}
.insight-body{flex:1}
.insight-label{font-size:10px;font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.insight-text{font-size:14px;color:var(--txt);line-height:1.55}
.quote{background:linear-gradient(135deg,rgba(20,184,166,.08),rgba(78,140,255,.04));border:1px solid rgba(20,184,166,.3);border-left:3px solid var(--teal);border-radius:10px;padding:16px 20px;margin-top:12px;display:flex;gap:14px;align-items:flex-start}
.quote-icon{font-size:20px;flex-shrink:0;color:var(--teal)}
.quote-body{flex:1}
.quote-label{font-size:10px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.quote-text{font-size:14px;color:var(--txt);line-height:1.55;font-style:italic}
.filter-bar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:var(--card);border:1px solid var(--bdr);border-radius:12px}
.filter-bar-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-right:6px}
.filter-btn{padding:7px 16px;border:1px solid var(--bdr2);background:transparent;color:var(--dim);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;border-radius:20px;cursor:pointer;transition:all .2s;letter-spacing:.3px}
.filter-btn:hover{background:var(--card2);color:var(--txt)}
.filter-btn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.filter-btn .count{opacity:.7;font-weight:400;margin-left:4px}
.setup{background:linear-gradient(135deg,rgba(78,140,255,.08),rgba(20,184,166,.08));border:1px solid var(--teal);border-radius:14px;padding:24px;margin-bottom:24px}
.setup h2{font-size:17px;margin-bottom:6px;color:var(--teal)}.setup p{font-size:13px;color:var(--dim);margin-bottom:14px}
.setup-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.setup input{flex:1;min-width:250px;border-radius:8px;border:1px solid var(--bdr2);background:var(--bg);color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:12px;padding:10px 14px;outline:none}
@media(max-width:768px){.app{padding:14px 12px}.mg5,.mg4{grid-template-columns:1fr 1fr}.mc-v{font-size:17px}}
</style>

<style>
.demo-badge {

}
</style>
</head>

function _parseDemoDate(s){if(!s)return null;const p=String(s).split('/');if(p.length!==3)return null;const d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));return isNaN(d)?null:d;}
function _parseDemoMonth(s){const d=_parseDemoDate(s);return d?d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"):null;}

function buildDemoData() {
  const leads = DEMO_LEADS.map(l => ({
    id: l['Lead ID'],
    date: l['Lead Received Date'],
    business: l['Business / Lead Name'],
    contact: l['Business / Lead Name'],
    type: l['Lead Type'],
    cost: l['Lead Cost Individually'],
    source: l['Lead Source'],
    product: l['Product Type'],
    requestedAmt: l['Requested Amount'],
    qualStatus: l['Qualification Status'],
    outcome: l['Application Outcome'],
    settleDate: l['Settlement Date'],
    settledAmt: l['Settled Amount'],
    commTotal: l['Commission Total'],
    finalStatus: l['Final Status'],
    lostReason: l['Lost Reason'],
    currentStage: l['Current Stage'],
    lender: l['Lender'],
    month: _parseDemoMonth(l['Lead Received Date']),
    settlementMonth: _parseDemoMonth(l['Settlement Date']),
    creditDecisionMonth: _parseDemoMonth(l['Credit Decision Date']),
    lostMonth: _parseDemoMonth(l['Lost Date'])
  }));
  
  // Compute loss reasons aggregate
  const lossMap = {};
  leads.filter(l => l.finalStatus === 'Lost' && l.lostReason).forEach(l => {
    lossMap[l.lostReason] = (lossMap[l.lostReason] || 0) + 1;
  });
  const totalLost = Object.values(lossMap).reduce((a,b)=>a+b,0);
  const lossReasons = Object.entries(lossMap)
    .sort((a,b)=>b[1]-a[1])
    .map(([reason, count]) => ({
      reason: reason,
      count: count,
      share: ((count/totalLost)*100).toFixed(1)+'%'
    }));
  
  return {leads, lossReasons};
}

function rebuildFundOneLedger(){
  if(!D||!D.leads||!D.leads.length)return;

  D.leads.forEach(l=>{
    if(l.settlementMonth){const k=l.settlementMonth;if(!byMonth[k])byMonth[k]={income:0,costs:0};byMonth[k].income+=(num(l.commTotal)||0)*0.7;}
    if(l.month){const k=l.month;if(!byMonth[k])byMonth[k]={income:0,costs:0};byMonth[k].costs+=num(l.cost)||0;}
  });
  const months=Object.keys(byMonth).sort().map(k=>{
    const[y,m]=k.split("-");
    const monthName=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][parseInt(m)-1];

  });
  FUNDONE_LEDGER.months=months;
}

function parseMonth(s){
  if(!s) return null;
  const str=String(s);
  // "27-Feb-2026" or "01/02/2026" or "Feb 2026"
  const m1=str.match(/(\d{1,2})-([A-Za-z]+)-(\d{4})/);
  if(m1){const M={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};return m1[3]+"-"+String(M[m1[2]]||1).padStart(2,"0");}
  const m2=str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m2)return m2[3]+"-"+m2[2].padStart(2,"0");
  const m3=str.match(/([A-Za-z]+)\s+(\d{4})/);
  if(m3){const M={Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12"};return m3[2]+"-"+(M[m3[1]]||"01");}
  return null;
}

  const[y,m]=ym.split("-");
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return M[parseInt(m)-1]+" "+y;
}
function parseDate(s){
  if(!s||s==="-")return null;
  const str=String(s);
  const m1=str.match(/(\d{1,2})-([A-Za-z]+)-(\d{4})/);
  if(m1){const M={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};return new Date(parseInt(m1[3]),M[m1[2]],parseInt(m1[1]));}
  const m2=str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m2)return new Date(parseInt(m2[3]),parseInt(m2[2])-1,parseInt(m2[1]));
  return null;
}
function computeBudget(leads){
  const WEEKLY=1000;
  const MONTHLY_EQ=WEEKLY*52/12; // $4,333.33 flat, matches Lead Cycles sheet
  const FOUR_WEEK_CAP=WEEKLY*4;  // $4,000 strict cap
  const now=new Date();
  const day=now.getDate();
  let cycleStart,cycleEnd;
  if(day>=15){cycleStart=new Date(now.getFullYear(),now.getMonth(),15);cycleEnd=new Date(now.getFullYear(),now.getMonth()+1,15);}
  else{cycleStart=new Date(now.getFullYear(),now.getMonth()-1,15);cycleEnd=new Date(now.getFullYear(),now.getMonth(),15);}
  let spent=0;
  leads.forEach(l=>{const d=parseDate(l.date);if(d&&d>=cycleStart&&d<cycleEnd)spent+=l.cost;});
  const leftMonthly=MONTHLY_EQ-spent;
  const leftCap=FOUR_WEEK_CAP-spent;
  const daysLeft=Math.max(0,Math.round((cycleEnd-now)/(1000*60*60*24)));
  const weeksLeft=Math.max(0.15,daysLeft/7);
  const weeklyAllowance=leftCap/weeksLeft;
  const cycleLabel=cycleStart.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][cycleStart.getMonth()]+" → "+cycleEnd.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][cycleEnd.getMonth()];
  return{cycleLabel,monthlyEq:MONTHLY_EQ,fourWeekCap:FOUR_WEEK_CAP,spent,leftMonthly,leftCap,daysLeft,weeklyAllowance,WEEKLY};
}

  for(const[k,v]of Object.entries(lr)){if(v>topCount){topReason=k;topCount=v;}}
  // ROI-driven insights first
  if(roi>=1.5&&s.settledCount>=3)return"You're making "+roi.toFixed(1)+"x back after split on lead spend. Every dollar in is "+fmt2(earned/spend)+" out. Pour more in.";
  if(roi>=1&&roi<1.5&&s.settledCount>=2)return"Breakeven-plus: "+fmt2(earned)+" earned after split vs "+fmt2(spend)+" spent. Working, but thin margin — more volume or better-converting sources would widen it.";
  if(roi<1&&s.settledCount>=2)return"You're behind right now: "+fmt2(earned)+" earned after split vs "+fmt2(spend)+" spent. Not a process issue — volume isn't high enough yet for the conversion rate to cover costs. Stack more settlements before judging.";
  if(s.settledCount===0&&s.submittedCount>=3)return s.submittedCount+" applications in-flight, nothing settled yet. The commission is sitting with the lenders, not with you — chase their timelines.";
  if(s.settledCount===0&&s.total>=10)return s.total+" leads in, zero settled. Could be timing (deals still cooking) or a product/source mismatch. Worth slicing by lead source to see which bucket is killing the numbers.";
  if(costPerSettlement>0)return "Each settlement is costing you "+fmt2(costPerSettlement)+" in lead spend. Keep that number shrinking and the ROI takes care of itself.";
  return "Nothing screaming for attention. Keep volume up.";
}

function getQuote(pool){
  const d=new Date();
  const start=new Date(d.getFullYear(),0,0);
  const day=Math.floor((d-start)/(1000*60*60*24));
  return pool[day%pool.length];
}

function parseAll(raw){
  const logRaw=raw.Leads_Log||[];
  const logHR=findRow(logRaw,0,"Lead ID");
  const hm=logHR>=0?headerMap(logRaw,logHR):{};
  const leads=[];
  for(let i=logHR+1;i<logRaw.length;i++){
    const r=logRaw[i];if(!r||!r[0]||!String(r[0]).trim())continue;
    leads.push({
      id:r[hm["Lead ID"]]||"",date:r[hm["Lead Received Date"]]||"",business:r[hm["Business / Lead Name"]]||"",
      type:r[hm["Lead Type"]]||"",cost:num(r[hm["Lead Cost Individually"]]),source:r[hm["Lead Source"]]||"",
      product:r[hm["Product Type"]]||"",requestedAmt:num(r[hm["Requested Amount"]]),
      qualStatus:r[hm["Qualification Status"]]||"",outcome:r[hm["Application Outcome"]]||"",
      settleDate:r[hm["Settlement Date"]]||"",settledAmt:num(r[hm["Settled Amount"]]),
      commTotal:num(r[hm["Commission Total"]]),finalStatus:r[hm["Final Status"]]||"",
      lostReason:r[hm["Lost Reason"]]||"",currentStage:r[hm["Current Stage"]]||"",
      month:parseMonth(r[hm["Lead Received Date"]]),
      settlementMonth:parseMonth(r[hm["Settlement Date"]]),
      creditDecisionMonth:parseMonth(r[hm["Credit Decision Date"]]),
      lostMonth:parseMonth(r[hm["Lost Date"]])
    });
  }

  // Loss reasons from Dashboard HUB (pre-computed with %)
  const dh=raw["Dashboard HUB"]||[];
  const lrHR=findRow(dh,0,"Reason");
  const lossReasons=[];
  if(lrHR>=0){for(let i=lrHR+1;i<dh.length;i++){const r=dh[i];if(!r||!r[0]||!String(r[0]).trim())break;lossReasons.push({reason:String(r[0]).trim(),count:num(r[1]),share:r[2]||""});}}

  return{leads,lossReasons};
}

function computeStats(leads){
  const total=leads.length;
  const totalSpend=leads.reduce((s,l)=>s+l.cost,0);
  const settled=leads.filter(l=>l.finalStatus==="Settled"||l.currentStage==="Settled");
  const approved=leads.filter(l=>l.outcome==="Approved"||l.finalStatus==="Settled"||l.currentStage==="Approved"||l.currentStage==="Settled");
  const declined=leads.filter(l=>l.outcome==="Declined"||l.lostReason==="Declined by Lender");
  // Submitted = anything that went to lender: approved, declined, or lost with a lender-related reason
  const submitted=leads.filter(l=>(l.outcome&&l.outcome!=="Not Submitted"&&l.outcome!=="-"&&l.outcome!=="")||l.lostReason==="Declined by Lender"||l.currentStage==="Submitted"||l.currentStage==="Approved"||l.currentStage==="Settled");
  const lost=leads.filter(l=>l.finalStatus==="Lost"||l.currentStage==="Lost");
  // Not qualified = closed/lost leads that never made it to submission
  const submittedIds=new Set(submitted.map(l=>l.id));
  const notQualified=lost.filter(l=>!submittedIds.has(l.id));
  // Loss reason breakdown for insight engine
  const lossReasonCounts={};
  leads.forEach(l=>{if((l.finalStatus==="Lost"||l.currentStage==="Lost")&&l.lostReason){lossReasonCounts[l.lostReason]=(lossReasonCounts[l.lostReason]||0)+1;}});

  const totalSettledAmt=settled.reduce((s,l)=>s+l.settledAmt,0);
  const totalComm=leads.reduce((s,l)=>s+l.commTotal,0);
  const commSettled=settled.reduce((s,l)=>s+l.commTotal,0);
  const totalRequested=leads.reduce((s,l)=>s+l.requestedAmt,0);

  return{
    total,totalSpend,
    settledCount:settled.length,approvedCount:approved.length,declinedCount:declined.length,
    submittedCount:submitted.length,lostCount:lost.length,
    notQualifiedCount:notQualified.length,
    notQualifiedRate:total>0?notQualified.length/total:0,
    successRate:total>0?settled.length/total:0,
    approvalRate:submitted.length>0?approved.length/submitted.length:0,
    declineRate:submitted.length>0?declined.length/submitted.length:0,
    avgSpendPerLead:total>0?totalSpend/total:0,
    totalSettledAmt,totalComm,commSettled,totalRequested,
    avgLoanAmt:settled.length>0?totalSettledAmt/settled.length:0,
    avgRequested:total>0?totalRequested/total:0,
    lossReasonCounts
  };
}

// For a given lead pool and target month (YYYY-MM or null for all time),
// compute stats that should be grouped by event date (settlement/decision/lost) instead of lead received date.
function computeSettlementStats(leads,targetMonth){
  const settled=leads.filter(l=>{
    const isSettled=(l.finalStatus==="Settled"||l.currentStage==="Settled");
    if(!isSettled)return false;
    if(targetMonth===null)return true;
    return l.settlementMonth===targetMonth;
  });
  const locked=leads.filter(l=>{
    if(targetMonth===null)return l.commTotal>0;
    return l.commTotal>0&&l.settlementMonth===targetMonth;
  });
  const commLocked=locked.reduce((s,l)=>s+l.commTotal,0);
  const commSettled=settled.reduce((s,l)=>s+l.commTotal,0);
  const totalSettledAmt=settled.reduce((s,l)=>s+l.settledAmt,0);
  const settledCount=settled.length;
  const avgLoanAmt=settledCount>0?totalSettledAmt/settledCount:0;
  // Approvals grouped by Credit Decision Date
  const approvedCount=leads.filter(l=>{
    const isApproved=(l.outcome==="Approved"||l.finalStatus==="Settled"||l.currentStage==="Approved"||l.currentStage==="Settled");
    if(!isApproved)return false;
    if(targetMonth===null)return true;
    return l.creditDecisionMonth===targetMonth;
  }).length;
  // Declines grouped by Lost Date (lender declines)
  const declinedCount=leads.filter(l=>{
    const isDeclined=(l.outcome==="Declined"||l.lostReason==="Declined by Lender");
    if(!isDeclined)return false;
    if(targetMonth===null)return true;
    return l.lostMonth===targetMonth;
  }).length;
  return{settledCount,commLocked,commSettled,totalSettledAmt,avgLoanAmt,approvedCount,declinedCount};
}

  }).join("");

  const allS=computeStats(filteredLeads);
  const allSd=computeSettlementStats(filteredLeads,null);
  const totRow='<tr class="trow">'+
    '<td class="cm">ALL TIME</td>'+
    '<td class="cm" style="text-align:right">'+allS.total+'</td>'+
    '<td class="cm" style="text-align:right">'+fmt2(allS.totalSpend)+'</td>'+
    '<td class="cm" style="text-align:right">'+fmt2(allS.avgSpendPerLead)+'</td>'+
    '<td class="cm c-pos" style="text-align:right">'+allSd.settledCount+'</td>'+
    '<td class="cm c-pos" style="text-align:right">'+allSd.approvedCount+'</td>'+
    '<td class="cm c-neg" style="text-align:right">'+allSd.declinedCount+'</td>'+
    '<td class="cm" style="text-align:right">'+pct(allS.successRate)+'</td>'+
    '<td class="cm" style="text-align:right">'+pct(allS.approvalRate)+'</td>'+
    '<td class="cm" style="text-align:right">'+pct(allS.declineRate)+'</td>'+
    '<td class="cm c-teal" style="text-align:right">'+fmtFull(allSd.commSettled)+'</td>'+
    '<td class="cm c-pos" style="text-align:right">'+fmtFull(allSd.commSettled*0.7)+'</td>'+
    '<td class="cm" style="text-align:right">'+fmtFull(allSd.avgLoanAmt)+'</td>'+
  '</tr>';

  // Build merged stats for the insight box (lead funnel from selStats + settlement-based commission/settlements)
  const selSd=selM?computeSettlementStats(filteredLeads,selM):null;
  const insightStats=selStats?Object.assign({},selStats,{commSettled:selSd.commSettled,settledCount:selSd.settledCount,totalSettledAmt:selSd.totalSettledAmt}):allS;

  document.getElementById("sec-monthly").innerHTML=
  leadTypeFilter()+
  monthCardsHTML+
  '<div class="sh" style="margin-top:24px"><h2>Monthly Breakdown'+typeSuffix+'</h2></div>'+
  '<div class="tw"><div class="ts"><table><thead><tr>'+
    '<th>Month</th><th style="text-align:right">Leads</th><th style="text-align:right">Spend</th><th style="text-align:right">Avg/Lead</th><th style="text-align:right">Settled</th><th style="text-align:right">Approved</th><th style="text-align:right">Declined</th><th style="text-align:right">Success %</th><th style="text-align:right">Approval %</th><th style="text-align:right">Decline %</th><th style="text-align:right">Comm. Settled</th><th style="text-align:right">After Split</th><th style="text-align:right">Avg Loan</th>'+
  '</tr></thead><tbody>'+rows+totRow+'</tbody></table></div></div>'+
  budgetBlock()+
  insightQuoteBlock(insightStats,QUOTES_MONTHLY);
}

function rFundOne(){
  const L=FUNDONE_LEDGER;
  // Build running balance per month
  let bal=L.openingBalance;
  const rows=L.months.map(m=>{
    const net=(m.income||0)-(m.costs||0)+(m.gstAdj||0);
    bal+=net;
    return{label:m.label,income:m.income||0,costs:m.costs||0,gstAdj:m.gstAdj||0,net,bal,notes:m.notes||""};
  });
  const currentBalance=bal;
  const toBreakEven=Math.max(0,-currentBalance);
  const isOwed=currentBalance<0;

  // Insight
  let insight;
  if(currentBalance>=0){
    insight="You're tracking well. Continued positive months keep building your buffer.";
  }else{
    const last=rows[rows.length-1];
    const lastNet=last?last.net:0;
    if(lastNet>=0){
      insight="You're sitting "+fmtFull(currentBalance)+" in the red. Last month you went +"+fmtFull(lastNet)+" — keep that momentum and you'll claw it back. Need to net at least "+fmtFull(toBreakEven)+" next month before any cash actually lands.";
    }else{
      insight="You're "+fmtFull(currentBalance)+" in the red. To get back to zero you need to net +"+fmtFull(toBreakEven)+" next month — that means total income (commissions) has to beat total costs (lead spend + bank statements + Equifax + Docusign + adjustments) by that much. Anything less and the hole keeps growing.";
    }
  }

  // Latest month breakdown if available
  const latest=rows[rows.length-1];

  document.getElementById("sec-fundone").innerHTML=
  '<div class="sh"><h2>FundOne Running Balance</h2><span class="badge">RCTI LEDGER</span></div>'+
  '<div class="mg mg3">'+
    '<div class="mc" style="border-color:'+(isOwed?"var(--red)":"var(--green)")+';border-width:2px"><div class="mc-l">Current Balance</div><div class="mc-v cm '+(isOwed?"c-neg":"c-pos")+'" style="font-size:28px">'+fmtFull(currentBalance)+'</div><div class="mc-s">'+(isOwed?"In the red — rolls into next RCTI":"You\'re in the green")+'</div></div>'+
    '<div class="mc"><div class="mc-l">To Break Even Next Month</div><div class="mc-v cm c-warn" style="font-size:24px">'+(isOwed?"+"+fmtFull(toBreakEven):"$0")+'</div><div class="mc-s">Net you need (income − costs)</div></div>'+
    '<div class="mc"><div class="mc-l">Opening Balance</div><div class="mc-v cm c-dim">'+fmtFull(L.openingBalance)+'</div><div class="mc-s">Carried in before tracking</div></div>'+
  '</div>'+

  '<div class="insight"><div class="insight-icon">💡</div><div class="insight-body"><div class="insight-label">What this means</div><div class="insight-text">'+esc(insight)+'</div></div></div>'+

  (latest?'<div class="sh" style="margin-top:24px"><h2>'+esc(latest.label)+' Breakdown</h2></div>'+
  '<div class="mg mg4">'+
    '<div class="mc"><div class="mc-l">Income</div><div class="mc-v cm c-pos">'+fmtFull(latest.income)+'</div><div class="mc-s">Settled commissions + insurance</div></div>'+
    '<div class="mc"><div class="mc-l">Costs</div><div class="mc-v cm c-neg">-'+fmtFull(latest.costs)+'</div><div class="mc-s">Leads + bank stmts + Equifax + Docusign</div></div>'+
    '<div class="mc"><div class="mc-l">GST / Adjustments</div><div class="mc-v cm c-neg">'+fmtFull(latest.gstAdj)+'</div><div class="mc-s">RCTI adjustments</div></div>'+
    '<div class="mc"><div class="mc-l">Month Net</div><div class="mc-v cm '+(latest.net<0?"c-neg":"c-pos")+'">'+fmtFull(latest.net)+'</div><div class="mc-s">Change to balance</div></div>'+
  '</div>':"")+

  '<div class="sh" style="margin-top:24px"><h2>Monthly Ledger</h2></div>'+
  '<div class="tw"><div class="ts"><table><thead><tr><th>Month</th><th style="text-align:right">Income</th><th style="text-align:right">Costs</th><th style="text-align:right">GST Adj</th><th style="text-align:right">Net</th><th style="text-align:right">Running Balance</th><th>Notes</th></tr></thead><tbody>'+
  '<tr><td class="cm c-dim">Opening</td><td></td><td></td><td></td><td></td><td class="cm" style="text-align:right">'+fmtFull(L.openingBalance)+'</td><td class="c-dim" style="font-size:11px">Carried in</td></tr>'+
  rows.map(r=>'<tr><td class="cm" style="font-weight:600">'+esc(r.label)+'</td><td class="cm c-pos" style="text-align:right">'+fmtFull(r.income)+'</td><td class="cm c-neg" style="text-align:right">-'+fmtFull(r.costs)+'</td><td class="cm c-neg" style="text-align:right">'+fmtFull(r.gstAdj)+'</td><td class="cm '+(r.net<0?"c-neg":"c-pos")+'" style="text-align:right">'+fmtFull(r.net)+'</td><td class="cm '+(r.bal<0?"c-neg":"c-pos")+'" style="text-align:right;font-weight:600">'+fmtFull(r.bal)+'</td><td style="font-size:11px;color:var(--dim);max-width:300px;white-space:normal">'+esc(r.notes)+'</td></tr>').join("")+
  '</tbody></table></div></div>'+

  '<div style="margin-top:14px;padding:12px 16px;background:var(--card);border:1px dashed var(--bdr2);border-radius:8px;font-size:11px;color:var(--mut);line-height:1.6">To add a new month, edit the <code style="color:var(--teal);font-family:\'JetBrains Mono\',monospace">FUNDONE_LEDGER</code> constant near the top of this file. Add a new entry to the <code style="color:var(--teal);font-family:\'JetBrains Mono\',monospace">months</code> array with <code style="color:var(--teal);font-family:\'JetBrains Mono\',monospace">{label, income, costs, gstAdj, notes}</code>.</div>';
}

function rLosses(){
  // All-time loss reasons computed from leads
  const reasons={};let totalLost=0;
  D.leads.forEach(l=>{if((l.finalStatus==="Lost"||l.currentStage==="Lost")&&l.lostReason){reasons[l.lostReason]=(reasons[l.lostReason]||0)+1;totalLost++;}});
  const sorted=Object.entries(reasons).sort((a,b)=>b[1]-a[1]);

  // Monthly loss breakdown
  const monthLosses={};
  D.leads.forEach(l=>{if((l.finalStatus==="Lost"||l.currentStage==="Lost")&&l.lostReason&&l.month){if(!monthLosses[l.month])monthLosses[l.month]={};monthLosses[l.month][l.lostReason]=(monthLosses[l.month][l.lostReason]||0)+1;}});
  const monthKeys=Object.keys(monthLosses).sort();

  const allTimeRows=sorted.map(([r,c])=>'<tr><td>'+esc(r)+'</td><td class="cm" style="text-align:right">'+c+'</td><td class="cm" style="text-align:right">'+pct(totalLost>0?c/totalLost:0)+'</td></tr>').join("");

  const monthRows=monthKeys.map(ym=>{
    const ml=monthLosses[ym];
    const total=Object.values(ml).reduce((s,v)=>s+v,0);
    const top=Object.entries(ml).sort((a,b)=>b[1]-a[1]);
    const topStr=top.map(([r,c])=>esc(r)+' ('+c+')').join(', ');
    return'<tr><td class="cm" style="font-weight:600">'+monthLabel(ym)+'</td><td class="cm" style="text-align:right">'+total+'</td><td style="font-size:12px;color:var(--dim)">'+topStr+'</td></tr>';
  }).join("");

  document.getElementById("sec-losses").innerHTML=
  '<div class="mg mg2">'+
    '<div><div class="sh"><h2>All Time Loss Reasons</h2><span class="badge">'+totalLost+' LOST</span></div>'+
    '<div class="tw"><div class="ts"><table><thead><tr><th>Reason</th><th style="text-align:right">Count</th><th style="text-align:right">%</th></tr></thead><tbody>'+allTimeRows+'</tbody></table></div></div></div>'+
    '<div><div class="sh"><h2>Losses by Month</h2></div>'+
    '<div class="tw"><div class="ts"><table><thead><tr><th>Month</th><th style="text-align:right">Lost</th><th>Reasons</th></tr></thead><tbody>'+monthRows+'</tbody></table></div></div></div>'+
  '</div>';
}

function rLeads(){
  const rows=D.leads.map(l=>{
    const sc=l.currentStage==="Settled"?"c-pos":l.currentStage==="Lost"?"c-neg":l.currentStage==="Approved"?"c-pos":"c-warn";
    return'<tr><td class="cm">'+esc(l.id)+'</td><td class="cm">'+sDate(l.date)+'</td><td>'+esc(l.business)+'</td><td>'+esc(l.source)+'</td><td>'+esc(l.product)+'</td><td class="cm" style="text-align:right">'+fmtFull(l.requestedAmt)+'</td><td class="cm" style="text-align:right">'+fmt2(l.cost)+'</td><td style="color:var(--dim)">'+esc(l.outcome)+'</td><td class="'+sc+'">'+esc(l.currentStage)+'</td></tr>';
  }).join("");
  document.getElementById("sec-leads").innerHTML=
  '<div class="sh"><h2>Leads Log</h2><span class="badge">'+D.leads.length+' LEADS</span></div>'+
  '<div class="tw"><div class="ts"><table><thead><tr><th>ID</th><th>Date</th><th>Business</th><th>Source</th><th>Product</th><th style="text-align:right">Requested</th><th style="text-align:right">Lead Cost</th><th>Outcome</th><th>Stage</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function exportXLSX(){
  if(!D)return;const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.leads.map(l=>({ID:l.id,Date:l.date,Business:l.business,Source:l.source,Product:l.product,Requested:l.requestedAmt,"Lead Cost":l.cost,Outcome:l.outcome,Stage:l.currentStage,"Settled Amt":l.settledAmt,Commission:l.commTotal,"Lost Reason":l.lostReason}))),"Leads");
  // Monthly stats
  const months={};D.leads.forEach(l=>{const m=l.month;if(!m)return;if(!months[m])months[m]=[];months[m].push(l);});
  const mStats=Object.keys(months).sort().map(ym=>{const s=computeStats(months[ym]);const sd=computeSettlementStats(D.leads,ym);return{Month:monthLabel(ym),Leads:s.total,Spend:s.totalSpend,"Avg/Lead":s.avgSpendPerLead,Settled:sd.settledCount,Approved:sd.approvedCount,Declined:sd.declinedCount,"Success%":s.successRate,"Approval%":s.approvalRate,"Decline%":s.declineRate,"Comm Settled":sd.commSettled,"After Split":sd.commSettled*0.7,"Avg Loan":sd.avgLoanAmt};});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(mStats),"Monthly");
  XLSX.writeFile(wb,"Broker_HUB_Export.xlsx");
}

renderTabs();
if(SCRIPT_URL){document.getElementById("setupBox").style.display="none";startRefresh();refreshData();}
else{document.getElementById("setupBox").style.display="block";document.getElementById("loadMsg").textContent="Connect above";}
