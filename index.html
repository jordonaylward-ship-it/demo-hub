function getUndoStack(id){
  try{return JSON.parse(localStorage.getItem('brain_undo_stack_'+id))||[]}catch(e){return[]}
}

function getUndoCount(id){return getUndoStack(id).length}

function undoLastUpdate(){
  const c=clients.find(x=&gt;String(x.id)===String(selectedId));
  if(!c)return;
  const stack=getUndoStack(c.id);
  if(!stack.length){toast('Nothing to undo');return}
  // Pop the most recent snapshot
  const last=stack.pop();
  localStorage.setItem('brain_undo_stack_'+c.id,JSON.stringify(stack));
  saveBrain(c.id,last.snapshot);
  toast('Undone · '+stack.length+' undo'+(stack.length===1?'':'s')+' left');
  selectClient(c.id);
}


function saveDob(){
  const c=clients.find(x=&gt;String(x.id)===String(selectedId));
  if(!c)return;
  const dob=document.getElementById('dobInput').value;
  if(!dob){toast('Pick a date');return}
  const brain=getBrain(c.id)||{};
  brain.dob=dob;
  saveBrain(c.id,brain);
  toast('DOB saved · '+(getStarSign(dob)?.sign||'Star sign assigned'));
  selectClient(c.id);
}

// === PROCESS UPDATE (AI behavioural analysis) ===
async function processUpdate(){
  const input=document.getElementById('updateInput').value.trim();
  if(!input){toast('Paste something first');return}
  const apiKey=localStorage.getItem('claude_api_key');
  if(!apiKey){toast('Set your API key in Lender Matcher → Settings first');return}
  const c=clients.find(x=&gt;String(x.id)===String(selectedId));
  if(!c)return;
  const brain=getBrain(c.id)||{updates:[],behaviouralTags:[],frictionLog:[]};

  // Push snapshot onto undo stack (keep last 10)
  const undoStackKey='brain_undo_stack_'+c.id;
  let undoStack=[];
  try{undoStack=JSON.parse(localStorage.getItem(undoStackKey))||[]}catch(e){}
  undoStack.push({snapshot:JSON.parse(JSON.stringify(brain)),timestamp:Date.now()});
  if(undoStack.length&gt;10)undoStack=undoStack.slice(-10);
  localStorage.setItem(undoStackKey,JSON.stringify(undoStack));

  const btn=document.getElementById('processBtn');
  const spinner=document.getElementById('processSpinner');
  btn.disabled=true;btn.textContent='Processing...';
  spinner.style.display='block';

  // Build context: client basics + existing brain + new input
  const existingStory=brain.story||'No story yet — this is the first update.';
  const existingTags=(brain.behaviouralTags||[]).join(' · ')||'None yet';
  const existingFriction=(brain.frictionLog||[]).map(f=&gt;f.text).join(' · ')||'None yet';
  const existingMood=brain.mood?(brain.mood.label+' — '+brain.mood.trend):'Not yet assessed';

  const systemPrompt=`You are a communication coach embedded in an Australian finance broker's CRM. Your single job: help Jordy understand HOW TO TALK TO THIS PERSON to win and keep their trust through to settlement.

You're NOT writing client-facing messages — Jordy has templates for that. You're a behind-the-scenes coach that reads incoming updates and tells Jordy how this human ticks.

What you focus on:
- COMMUNICATION STYLE — how they prefer to be spoken to (direct vs warm, brief vs detailed, calls vs texts, formal vs casual)
- EMOTIONAL STATE — what they're feeling right now, what's shifting, what might be unsaid
- INCONSISTENCIES — anything in the data or comms that doesn't add up and needs clarification
- PERSONALITY ANCHORS — using star sign as a soft framework alongside observed behaviour
- COACHING TIPS — concrete how-to-handle-them advice for the next interaction

What you DON'T focus on:
- Generic behavioural tags ('responds to texts', 'mentions partner') — these are noise unless tied to a coaching action
- Restating obvious facts about the deal
- Speculating about lenders, rates, or product fit (that's the Lender Matcher's job)
- Long lists — quality over quantity

Use the star sign as ONE input alongside observed behaviour. Example: &quot;He's a Capricorn — typically values structure and direct talk. The 'why is this so hard?' comment is a flag he's losing patience with vague answers. Lead with concrete next steps, no fluff.&quot;

You MUST return ONLY valid JSON with this exact structure (no markdown backticks, no preamble):

{
  &quot;story&quot;: &quot;Cumulative client narrative — 3-5 sentences of flowing prose. Build on the existing story, don't replace it. Brief any other broker who needs to take this client over tomorrow: who they are, what they want, where they're stuck, what to watch for. Direct and observational.&quot;,
  &quot;communicationCoaching&quot;: {
    &quot;channel&quot;: &quot;Best way to reach them right now — 'phone' / 'SMS' / 'email' / 'mixed'&quot;,
    &quot;tone&quot;: &quot;How to pitch the tone — 'direct and brief' / 'warm and patient' / 'detailed and reassuring' / etc&quot;,
    &quot;timing&quot;: &quot;When/how often to contact — e.g. 'Daytime only — works night shift', 'Weekly check-in max — overcontacting will scare them off'&quot;,
    &quot;tip&quot;: &quot;ONE specific actionable coaching tip for the next interaction. Be concrete. e.g. 'Open with the rate first, not the process — he wants to know if it's worth his time before he engages on details'&quot;
  },
  &quot;starSign&quot;: {
    &quot;sign&quot;: &quot;Star sign name (will be passed in to you - just echo it back)&quot;,
    &quot;lens&quot;: &quot;1-2 sentences applying the star sign as a coaching lens, anchored to OBSERVED behaviour. Don't quote astrology generically — tie it to what the data shows. e.g. 'Capricorn traits showing — pragmatic, time-conscious. The way he asked about turnaround time before product details confirms the pattern.'&quot;
  },
  &quot;mood&quot;: {
    &quot;icon&quot;: &quot;single emoji&quot;,
    &quot;label&quot;: &quot;2-4 words, e.g. 'Frustrated but engaged', 'Quietly confident', 'Pulling away'&quot;,
    &quot;trend&quot;: &quot;1 sentence on direction of travel and what to do about it&quot;
  },
  &quot;inconsistencies&quot;: [&quot;Array of things that don't add up and need clarification. Empty array if nothing. e.g. 'Says income is $3,570/m but bank shows regular $4,200 deposits — confirm true take-home', 'Living expenses declared at $1,127/m but no rent listed — may be undeclared cash payment to family'&quot;],
  &quot;summary&quot;: &quot;One sentence summarising what this update told us. For the timeline.&quot;
}

The broker's name is Jordy. The client's first name is provided so you can reference them naturally.`;

  // Redact PII before sending to AI
  const safeName=redactName(c.name);
  const safeFirstName=(c.name||'').split(' ')[0]||'Client';
  const safeInput=redactPII(input);
  // Get star sign from DOB if available
  const dobToUse=c.dob||brain.dob;const starSignData=dobToUse?getStarSign(dobToUse):null;
  const starSignContext=starSignData?starSignData.sign+' — '+starSignData.traits:'Unknown (no DOB)';
  const existingCoaching=brain.communicationCoaching?JSON.stringify(brain.communicationCoaching):'None yet';

  const userMsg=`CLIENT: ${safeFirstName} ${safeName.split(' ').slice(1).join(' ')||''}
STAGE: ${c.stage||'New'}
PRODUCT: ${c.product||'Vehicle Finance'}
REQUESTED: $${Number(c.requested||0).toLocaleString()}
LENDER: ${c.lender||'Not yet assigned'}
STAR SIGN CONTEXT: ${starSignContext}

EXISTING STORY:
${existingStory}

EXISTING COMMUNICATION COACHING:
${existingCoaching}

CURRENT MOOD READ:
${existingMood}

NEW UPDATE TO PROCESS (PII redacted):
${safeInput}

Process this update and return your JSON response. Use the first name &quot;${safeFirstName}&quot; naturally in the story. The starSign field in your response should echo back: ${starSignData?starSignData.sign:'Unknown'}.`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-5-20250929',max_tokens:1500,system:systemPrompt,messages:[{role:'user',content:userMsg}]})
    });
    const data=await resp.json();
    if(data.error)throw new Error(data.error.message);
    let text=data.content.map(x=&gt;x.text||'').join('');
    text=text.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
    const start=text.indexOf('{');const end=text.lastIndexOf('}');
    if(start&gt;=0&amp;&amp;end&gt;start)text=text.substring(start,end+1);
    const result=JSON.parse(text);

    // Update brain
    brain.story=result.story||brain.story;
    brain.communicationCoaching=result.communicationCoaching||brain.communicationCoaching;
    brain.starSign=result.starSign||brain.starSign;
    brain.mood=result.mood||brain.mood;
    brain.lastUpdated=new Date().toISOString();
    if(!brain.updates)brain.updates=[];
    brain.updates.push({date:new Date().toISOString(),input:input,summary:result.summary||'Update processed'});
    // Inconsistencies replace the old friction log
    if(result.inconsistencies&amp;&amp;result.inconsistencies.length){
      if(!brain.inconsistencies)brain.inconsistencies=[];
      const today=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'short'});
      result.inconsistencies.forEach(f=&gt;{brain.inconsistencies.push({text:f,when:today})});
    }
    saveBrain(c.id,brain);
    toast('Brain updated · Undo available for 5 min');
    selectClient(c.id);
  }catch(e){
    toast('Error: '+e.message);console.error(e);
  }finally{
    btn.disabled=false;btn.textContent='🧠 Process Update';
    spinner.style.display='none';
  }
}

// === GENERATE POST-MORTEM ===
async function generatePostmortem(){
  const apiKey=localStorage.getItem('claude_api_key');
  if(!apiKey){toast('Set your API key first');return}
  const c=clients.find(x=&gt;String(x.id)===String(selectedId));
  if(!c)return;
  const brain=getBrain(c.id)||{};
  if(!brain.story&amp;&amp;!(brain.updates&amp;&amp;brain.updates.length)){
    toast('No brain data yet — add some updates first');return;
  }

  if(!confirm('Generate a deal post-mortem? Uses Opus 4.6 (~12-18¢) for deeper analysis.'))return;

  toast('Generating post-mortem — this takes ~15 seconds');

  const updateChain=(brain.updates||[]).map((u,i)=&gt;'UPDATE '+(i+1)+' ('+new Date(u.date).toLocaleDateString('en-AU')+'):\n'+u.input).join('\n\n---\n\n');

  const systemPrompt=`You are a behavioural coach for finance brokers. The broker has just closed (settled or lost) a deal with a client. Your job is to look back across the entire client journey and extract specific learnings the broker can apply to future deals.

You'll receive: the client story, behavioural observations, friction log, mood evolution, all the raw updates over time, and the deal outcome.

Return ONLY valid JSON (no markdown, no preamble):

{

<script>
// ═══ PASSWORD GATE ═══
// To change the password: replace EXPECTED_HASH with the SHA-256 of your new password.
// Compute a new hash at: https://emn178.github.io/online-tools/sha256.html
// (Type your password, copy the resulting hash, paste it below)
const EXPECTED_HASH = "5c2d603f8c331346ab90777f73e091cc67fe99004c2782f7c7068764a5ef1558";
const SESSION_DAYS = 30;
const SESSION_KEY = "bcc_unlock_until";

async function sha256(text){
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function isUnlocked(){
  const until = parseInt(localStorage.getItem(SESSION_KEY)||"0");
  return until > Date.now();
}

function unlock(remember){
  if(remember){
    const until = Date.now() + SESSION_DAYS*24*60*60*1000;
    localStorage.setItem(SESSION_KEY, until.toString());
  } else {
    sessionStorage.setItem(SESSION_KEY, "1");
  }
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("appShell").style.display = "flex";
}

function lock(){
  localStorage.removeItem(SESSION_KEY);
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

async function tryUnlock(){
  const input = document.getElementById("gpw").value;
  const err = document.getElementById("gate-err");
  const btn = document.getElementById("gate-go");
  if(!input){ err.textContent = "Enter a password"; return }
  btn.disabled = true; btn.textContent = "Checking...";
  err.textContent = "";
  try {
    const hash = await sha256(input);
    if(hash === EXPECTED_HASH){
      const remember = document.getElementById("gate-remember").checked;
      unlock(remember);
    } else {
      err.textContent = "Incorrect password";
      document.getElementById("gpw").value = "";
      document.getElementById("gpw").focus();
    }
  } catch(e){
    err.textContent = "Error: " + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Unlock";
  }
}

// Check on load — if unlocked, skip gate
if(isUnlocked() || sessionStorage.getItem(SESSION_KEY)){
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("appShell").style.display = "flex";
}

document.getElementById("gate-go").addEventListener("click", tryUnlock);
document.getElementById("gpw").addEventListener("keydown", function(e){ if(e.key === "Enter") tryUnlock(); });

(function(){
  document.querySelectorAll(".nav-tab").forEach(function(btn){
    btn.addEventListener("click",function(){
      var tool=btn.getAttribute("data-tool");
      document.querySelectorAll(".nav-tab").forEach(function(b){b.classList.remove("on")});
      btn.classList.add("on");
      document.querySelectorAll(".frame-wrap iframe").forEach(function(f){f.classList.remove("on")});
      document.getElementById("frame-"+tool).classList.add("on");
    });
  });
  // Lock button
  var lb = document.getElementById("lockBtn");
  if(lb) lb.addEventListener("click", function(){ if(confirm("Lock the app? You'll need to re-enter your password.")) lock(); });

  // ═══ THEME TOGGLE ═══
  function getTheme(){ try { return localStorage.getItem("bcc_theme") || "dark" } catch(e) { return "dark" } }
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("bcc_theme", t) } catch(_) {}
    var btn = document.getElementById("themeBtn");
    if(btn) btn.textContent = (t === "dark" ? "☀️" : "🌙");
    // Broadcast to all iframes
    document.querySelectorAll("iframe").forEach(function(f){
      try { f.contentWindow.postMessage({type:"theme", theme:t}, "*") } catch(_) {}
    });
  }
  applyTheme(getTheme());
  var tb = document.getElementById("themeBtn");
  if(tb) tb.addEventListener("click", function(){
    var current = getTheme();
    applyTheme(current === "dark" ? "light" : "dark");
  });

  // When iframes signal ready, push current theme to them
  window.addEventListener("message", function(e){
    if(e.data && e.data.type === "iframeReady"){
      var t = getTheme();
      try { e.source.postMessage({type:"theme", theme:t}, "*") } catch(_) {}
    }
  });

  // Relay dashboard lead data to stories iframe
  window.addEventListener("message",function(e){
    if(e.data&&e.data.type==="leadsData"){
      var sf=document.getElementById("frame-stories");
      if(sf&&sf.contentWindow)sf.contentWindow.postMessage(e.data,"*");
    }
  });
})();
</script>
