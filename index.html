&lt;script&gt;
function switchPane(id,el){
  document.querySelectorAll('.pane').forEach(p=&gt;p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=&gt;t.classList.remove('on'));
  document.getElementById('pane-'+id).classList.add('on');
  el.classList.add('on');
  if(id==='saved')renderSaved();
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=&gt;t.classList.remove('show'),2200)}
function esc(s){return s?String(s).replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;').replace(/&gt;/g,'&amp;gt;'):''}

// ═══ SMART REDACTION ═══
function redactPhone(s){if(!s)return null;const d=s.replace(/\D/g,'');if(d.length&lt;4)return 'xxx';return d.slice(0,d.length-3)+'xxx'}
function redactEmail(s){if(!s||!s.includes('@'))return null;const[u,d]=s.split('@');if(u.length&lt;=2)return u+'xxx@'+d;return u.slice(0,2)+'xxx@'+d}
function redactLastName(s){if(!s)return null;return s.charAt(0)+'xxx'}
function redactNumLast3(s){if(!s)return 'xxx';const d=s.replace(/\D/g,'');if(d.length&lt;4)return 'xxx';return d.slice(0,d.length-3)+'xxx'}

// ═══ EXTRACTION ═══
function doExtract(){
  const raw=document.getElementById('rawInput').value.trim();
  if(!raw){toast('Paste something first');return}
  const g=(patterns)=&gt;{for(const p of patterns){const m=raw.match(p);if(m&amp;&amp;m[1])return m[1].trim()}return null};
  const gn=(patterns)=&gt;{const v=g(patterns);if(!v)return null;const n=parseFloat(v.replace(/,/g,''));return isNaN(n)?null:n};

  // Names — keep first, redact last
  const firstName=g([/First Name\s*\*?\s*\n?\s*([^\n]+)/i])||'';
  const lastName=g([/Last Name\s*\*?\s*\n?\s*([^\n]+)/i])||'';
  const middleName=g([/Middle Name\s*\n?\s*([^\n]+)/i])||'';
  // Equifax format: &quot;Report for: DEON FINNING&quot; or name in ALL CAPS on its own line
  let eqFirstName=firstName,eqLastName=lastName;
  if(!firstName||!lastName){
    const reportForMatch=raw.match(/Report for:?\s*\n?\s*([A-Z][A-Z\s'-]+)\n/);
    if(reportForMatch){
      const parts=reportForMatch[1].trim().split(/\s+/);
      if(parts.length&gt;=2){
        eqFirstName=parts[0].charAt(0)+parts[0].slice(1).toLowerCase();
        eqLastName=parts.slice(1).map(p=&gt;p.charAt(0)+p.slice(1).toLowerCase()).join(' ');
      }
    }
  }
  const displayName=eqFirstName+(middleName?' '+middleName.charAt(0)+'.':'')+(eqLastName?' '+redactLastName(eqLastName):'');

  // DOB — support multiple formats: &quot;07/08/1997&quot;, &quot;07 August 1997&quot;, &quot;D.O.B. 07 August 1997 (28 years old)&quot;
  let dob='';
  const dobLong=raw.match(/D\.?O\.?B\.?\s*[:.]?\s*(\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{4})/i)
             ||raw.match(/Date of Birth\s*\*?\s*\n?\s*(\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{4})/i);
  const dobSlash=g([/Date of Birth\s*\*?\s*\n?\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/i,/D\.?O\.?B\.?\s*[:.]?\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/i]);
  dob=dobLong?dobLong[1]:(dobSlash||'');
  let age='';
  // Try extracting explicit age from &quot;(28 years old)&quot; pattern first
  const explicitAge=raw.match(/\((\d{1,3})\s*years?\s*old\)/i);
  if(explicitAge){
    age=parseInt(explicitAge[1]);
  }else if(dob){
    // Parse long format: &quot;07 August 1997&quot;
    const months={january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,september:8,october:9,november:10,december:11,jan:0,feb:1,mar:2,apr:3,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    const longM=dob.match(/(\d{1,2})\s+(\w+)\.?\s+(\d{4})/);
    if(longM){
      const day=parseInt(longM[1]);
      const mon=months[longM[2].toLowerCase()];
      const year=parseInt(longM[3]);
      if(mon!==undefined){
        const birth=new Date(year,mon,day);
        age=Math.floor((new Date()-birth)/(365.25*24*60*60*1000));
      }
    }else{
      const parts=dob.split(/[\/\-]/);
      if(parts.length===3){
        const day=parseInt(parts[0]),month=parseInt(parts[1])-1;
        let year=parseInt(parts[2]);
        if(year&lt;100)year+=1900;  // Handle 2-digit year
        const birth=new Date(year,month,day);
        age=Math.floor((new Date()-birth)/(365.25*24*60*60*1000));
      }
    }
  }
  const gender=g([/(Male|Female|Other)\s*\n?\s*Gender/i,/Gender\s*\*?\s*\n?\s*(Male|Female|Other)/i])||'';

  // Contact — partial redaction
  const email=g([/Email\s*\*?\s*\n?\s*([\S@.]+@[\S.]+)/i])||'';
  const phone=g([/Mobile[^+\d]*(?:\+61\s*)?([0-9\s]+)/i])||'';

  // Address — keep suburb/state/postcode
  const suburb=g([/Suburb\s*\n?\s*([A-Z\s]+)\s*\n/i])||'';
  const state=g([/([A-Z]{2,3})\s*\n\s*State/i])||'';
  const postcode=g([/Postcode\s*\*?\s*\n?\s*(\d{4})/i])||'';
  const country=g([/(Australia|New Zealand)/i])||'Australia';

  // Citizenship &amp; marital
  // Citizenship — handle multiple layouts robustly
  let citizen='Unknown';
  // Try Zink format first: value immediately before &quot;Australian Citizen&quot; label
  const zinkCitMatch=raw.match(/\b(Citizen|Permanent Resident|Resident)\s*\n\s*Australian Citizen/i);
  if(zinkCitMatch){citizen=zinkCitMatch[1];}
  else{
    // PDF format: &quot;Citizenship&quot; label somewhere, then value &quot;Citizen&quot; appears later
    // Search the window after &quot;Citizenship&quot; label, skipping &quot;Australian Citizen&quot; false-matches
    const citzIdx=raw.search(/\bCitizenship\b/i);
    if(citzIdx&gt;=0){
      // Skip past &quot;Australian Citizen&quot; label if it appears (Zink has this)
      const windowStart=citzIdx+'Citizenship'.length;
      const windowEnd=Math.min(windowStart+250,raw.length);
      let scope=raw.substring(windowStart,windowEnd).replace(/Australian\s+Citizen/gi,'');
      const valMatch=scope.match(/\b(Citizen|Permanent Resident|PR\b|Temporary Resident|Visa Holder|Visa)\b/i);
      if(valMatch){citizen=valMatch[1];}
    }
  }
  // Final fallback: any standalone &quot;Australian Citizen:\s*Citizen&quot; pattern
  if(citizen==='Unknown'){
    const fallback=raw.match(/Australian Citizen[^\n]{0,5}\s*(Citizen|Permanent Resident|Visa)/i);
    if(fallback)citizen=fallback[1];
  }
  // Marital Status — handle both orders
  let marital='';
  const zinkMar=raw.match(/\b(Single|Married|De[ -]?facto|Separated|Divorced|Widowed)\s*\n\s*Marital Status/i);
  if(zinkMar){marital=zinkMar[1];}
  else{
    const marIdx=raw.search(/Marital\s+Status/i);
    if(marIdx&gt;=0){
      const scope=raw.substring(marIdx+'Marital Status'.length,marIdx+200);
      const valMatch=scope.match(/\b(Single|Married|De[ -]?facto|Separated|Divorced|Widowed)\b/i);
      if(valMatch){marital=valMatch[1];}
    }
  }
  const dependants=gn([/Number of Dependants[^\n]*?\)[^0-9]*(\d+)/i,/Number of Dependants[^\n]*\n\s*(\d+)/i])||0;

  // License — keep type/state/expiry, redact numbers
  const licType=g([/License Type\s*\n?\s*(Open|Provisional|P\d?|Learner|L|Full)/i,/(Open|Provisional|P\d?|Learner|L)\s*\n\s*License Type/i])||'';
  const licState=g([/State of Issue\s*\n?\s*([A-Z]{2,3})/i,/([A-Z]{2,3})\s*\n\s*State of Issue/i])||'';
  const licExpiry=g([/(?:License|Card).*?Expiry Date\s*\n?\s*([0-9\/\-]+)/i])||g([/Expiry Date\s*\n?\s*([0-9\/\-]+)/i])||'';

  // Employment — KEEP all
  // Employment Type — PDF has &quot;Employment Status\nFull Time&quot;, Zink has value-first
  let empType='';
  const empZinkType=raw.match(/\b(Full Time|Part Time|Casual|Self[- ]?Employed|Contract|Permanent|Temporary)\s*\n\s*Type/i);
  if(empZinkType){empType=empZinkType[1];}
  else{
    const empStatusMatch=raw.match(/Employment Status[\s\S]{0,150}?\b(Full Time|Part Time|Casual|Self[- ]?Employed|Contract|Permanent|Temporary)\b/i);
    if(empStatusMatch){empType=empStatusMatch[1];}
    else{
      const typeMatch=raw.match(/\bType\s*\n?\s*(Full Time|Part Time|Casual|Self[- ]?Employed|Contract)/i);
      if(typeMatch){empType=typeMatch[1];}
    }
  }
  // Scope tenure search to CURRENT EMPLOYMENT section (PDF has values in tabular format)
  let empYears=0,empMonths=0;
  const empSection=raw.match(/CURRENT EMPLOYMENT[\s\S]{0,600}?(\d+)\s*yrs?\s*(\d+)\s*mths?/i);
  if(empSection){empYears=parseInt(empSection[1])||0;empMonths=parseInt(empSection[2])||0;}
  else{
    // Fallback: Zink format with Years/Months labels on separate lines near employment
    const empCombined=raw.match(/Time Employed[\s\S]{0,200}?(\d+)\s*yrs?\s*(\d+)\s*mths?/i);
    if(empCombined){empYears=parseInt(empCombined[1])||0;empMonths=parseInt(empCombined[2])||0;}
    else{
      // Zink structured format
      const empYrsMatch=raw.match(/Years\s*\*?\s*\n?\s*(\d+)\s*\n\s*Months/i);
      if(empYrsMatch){empYears=parseInt(empYrsMatch[1])||0;}
      const empMonMatch=raw.match(/Months\s*\*?\s*\n?\s*(\d+)\s*\n\s*Employer/i);
      if(empMonMatch){empMonths=parseInt(empMonMatch[1])||0;}
    }
  }
  const empTenure=empYears&gt;0?(empYears+'y '+(empMonths||0)+'m'):(empMonths&gt;0?empMonths+'m':'Not captured');
  const occupation=g([/Title\s*\n?\s*([^\n]+)/i])||'';
  const industry=g([/Industry\s*\n?\s*([^\n]+)/i])||'';
  const employer=g([/Employer\s*\n?\s*([A-Z][A-Z\s&amp;'-]+)/i])||'';
  const empABN=g([/ABN\s*\n?\s*(\d{11}|\d{2}\s\d{3}\s\d{3}\s\d{3})/i])||'';

  // Income — KEEP all
  // Income extraction — try Zink, then PDF fallbacks
  let netIncome=null,netIncomeMonthly=null,incomeFreq='',incomeSource='';
  
  // Zink: &quot;Net Income (After tax) * $ 1301.12\n$5,637.75/m\nWeekly&quot;
  // Captures weekly amount AND monthly equivalent in one match
  const zinkIncome=raw.match(/Net Income[^$]*\$\s*\n?\s*([0-9,.]+)[\s\S]*?\$([0-9,.]+)\s*\/\s*m[\s\S]{0,20}?(Weekly|Fortnightly|Monthly|Annually)/i);
  if(zinkIncome){
    netIncome=parseFloat(zinkIncome[1].replace(/,/g,''));
    netIncomeMonthly=parseFloat(zinkIncome[2].replace(/,/g,''));
    incomeFreq=zinkIncome[3];
    incomeSource='Zink applicant';
  }else{
    // Simpler Zink: just amount + frequency
    const simpleZink=raw.match(/Net Income[^$]*\$\s*\n?\s*([0-9,.]+)[\s\S]{0,80}?(Weekly|Fortnightly|Monthly|Annually)/i);
    if(simpleZink){
      netIncome=parseFloat(simpleZink[1].replace(/,/g,''));
      incomeFreq=simpleZink[2];
      incomeSource='Zink applicant';
    }else{
      // PDF: &quot;Salary/Wages $5199.60&quot; (already monthly)
      const pdfSalary=raw.match(/Salary\/Wages\s*\$\s*([0-9,.]+)/i);
      if(pdfSalary){
        netIncome=parseFloat(pdfSalary[1].replace(/,/g,''));
        incomeFreq='Monthly';
        netIncomeMonthly=netIncome;
        incomeSource='PDF Salary/Wages (monthly)';
      }
    }
  }
  // If we have weekly amount but no monthly, calculate it (52/12)
  if(netIncome&amp;&amp;incomeFreq==='Weekly'&amp;&amp;!netIncomeMonthly){
    netIncomeMonthly=Math.round(netIncome*52/12*100)/100;
  }
  if(netIncome&amp;&amp;incomeFreq==='Fortnightly'&amp;&amp;!netIncomeMonthly){
    netIncomeMonthly=Math.round(netIncome*26/12*100)/100;
  }

  // Living
  let livingType=g([/(Boarded|Boarding|Renting|Rent|Mortgage|Own\w*)\s*\n\s*Ownership/i,/Ownership\s*\*?\s*\n?\s*(Rent|Mortgage|Board\w*|Own\w*|Boarding)/i])||'Unknown';
  if(/^Boarded$/i.test(livingType))livingType='Boarding';
  const rentAmt=gn([/(?:Rent|Ownership|Mortgage)[\s\S]{0,100}?\$\s*\n?\s*([0-9,.]+)/]);
  const rentFreq=g([/(?:Rent|Ownership|Mortgage)[\s\S]*?\$[0-9,.]+[^\n]*\n[^\n]*?(Weekly|Fortnightly|Monthly)/i])||'';
  const timeAtAddrMatch=raw.match(/Time at Address[\s\S]{0,30}?(\d+)\s*yrs?\s*(\d+)\s*mths?/i);
  const yearsAtAddress=timeAtAddrMatch?parseInt(timeAtAddrMatch[1])||0:(gn([/Years\s*\n?\s*(\d+)\s*\n\s*Months/i])||0);
  const monthsAtAddress=timeAtAddrMatch?parseInt(timeAtAddrMatch[2])||0:0;

  // Landlord cross-check
  const landlordName=g([/Landlord[\s\S]*?(?:Agency|Landlord)\s+Name\s*\n?\s*([^\n]+)/i]);
  const familyKw=/\b(parent|parents|mum|mother|dad|father|family|bro|sister|sibling|aunty|uncle|grand)\b/i;
  let livingNote='';
  if(landlordName&amp;&amp;familyKw.test(landlordName)){livingType='Boarding (family)';livingNote=' — Landlord field shows: &quot;'+landlordName+'&quot;'}

  // Credit — KEEP everything
  const creditScore=gn([/(?:Credit|One|Equifax|Experian)\s*Score\s*\n?\s*(\d{3,4})/i,/Score[\s\S]{0,10}?(\d{3,4})/i,/\bScore\s*[:\s]\s*(\d{3,4})/i]);
  const fileAge=g([/Age of File\s*\n?\s*([^\n]+)/i])||'Unknown';
  const defaults=g([/Financial Defaults\s*\n?\s*([^\n]+)/i])||'None found';
  const nonFinDefaults=g([/Non Financial Defaults\s*\n?\s*([^\n]+)/i])||'None';
  const payday=g([/Payday Enquiries\s*\n?\s*([^\n]+)/i])||'Unknown';
  const insolvency=g([/Insolvency\s*\n?\s*([^\n]+)/i])||'None';
  // Financial Hardship — handle Equifax format &quot;Financial Hardship Information (FHI)  No&quot; vs Zink &quot;Financial Hardship\nNo&quot;
  // BUG FIX: Previous regex was matching &quot;FHI&quot; from within the question label as if it were a positive answer
  const fhiMatch=raw.match(/Financial Hardship Information\s*\(FHI\)\s*[:\n\s]*\s*(Yes|No|Active|Current)/i);
  const zinkHardshipMatch=fhiMatch||raw.match(/\bFinancial Hardship\b(?!\s+Information)[\s\S]{0,30}?\b(Yes|No|Active|Current)\b/i);
  const hardship=zinkHardshipMatch?zinkHardshipMatch[1]:'No';
  const judgements=g([/Judgements\s*\n?\s*(\d+)/i])||'0';
  const ccr=g([/Worst CCR\s*\n?\s*(\d+)/i])||'0';
  const enquiries=g([/Credit Shopping\s*\n?\s*([^\n]+)/i])||'';

  // Loan request
  const loanAmt=gn([/Requested Loan Amount[\s\S]{0,30}?\$\s*([0-9,.]+)/i,/Loan Amount[\s\S]{0,30}?\$\s*([0-9,.]+)/i,/Requested[\s\S]{0,30}?Amount[\s\S]{0,30}?\$\s*([0-9,.]+)/i]);
  const term=gn([/Term \(months\)\s*\n?\s*(\d+)/i]);
  const condition=g([/Condition\s*\n?\s*(New|Used|Demo)/i])||'';
  const affordability=gn([/Affordability\s*\$\s*\n?\s*([0-9,.]+)/i]);
  const affordFreq=g([/Affordability[\s\S]*?\$[\s\S]*?(Weekly|Fortnightly|Monthly)/i])||'';
  const description=g([/Description\s*\n?\s*([^\n]+)/i])||'';
  const purchaseCost=gn([/Purchase Cost\s*\$\s*\n?\s*([0-9,.]+)/i]);
  const deposit=gn([/Deposit\s*\$\s*\n?\s*([0-9,.]+)/i]);
  const saleType=g([/Sale Type\s*\n?\s*(Dealership|Private|Dealer)/i])||'';
  const appType=g([/Applicant Type\s*\n?\s*(Consumer|Commercial)/i])||'Consumer';

  // Living expenses summary
  const expenses={};
  const expMatches=raw.matchAll(/(Groceries|Fuel|Telecommunications|Entertainment|Insurance|Childcare|Education|Medical)[\s\S]{0,80}?Type[\s\S]{0,80}?\$\s*\n?\s*([0-9,.]+)/gi);
  for(const m of expMatches){expenses[m[1]]=parseFloat(m[2].replace(/,/g,''))}
  const totalExpenses=g([/Total[:\s]*\$\s*([0-9,.]+)/i]);

  // Capacity
  const totalIncMonth=g([/Total Income[:\s]*\$\s*([0-9,.]+)/i]);
  const totalExpMonth=g([/Total Expenses[:\s]*\$\s*([0-9,.]+)/i]);
  const uncommittedInc=g([/Uncommitted Income[:\s]*\$\s*([0-9,.]+)/i]);

  // Debts &amp; assets count
  const debtMatches=raw.match(/Liability[\s\S]*?Balance[^$]*\$\s*([0-9,.]+)/gi)||[];
  const assetMatches=raw.match(/Asset Value[^$]*\$\s*([0-9,.]+)/gi)||[];

  // === BUILD STRUCTURED OUTPUT ===
  let out='═══════════════════════════════════════\n';
  out+='SANITISED CLIENT PROFILE FOR LENDER ASSESSMENT\n';
  out+='═══════════════════════════════════════\n\n';

  out+='APPLICANT IDENTITY (partially redacted)\n';
  out+='  Name: '+(displayName||'Unknown')+'\n';
  if(dob)out+='  DOB: '+dob+(age?' (age '+age+')':'')+'\n';
  if(gender)out+='  Gender: '+gender+'\n';
  out+='  Citizenship: '+citizen+'\n';
  out+='  Marital Status: '+(marital||'Unknown')+'\n';
  out+='  Dependants: '+dependants+'\n';
  if(licType||licState||licExpiry){
    out+='  License: '+(licType||'Unknown')+' '+(licState?'('+licState+')':'')+(licExpiry?' expires '+licExpiry:'')+' (number redacted)\n';
  }
  if(email)out+='  Email: '+(redactEmail(email)||'redacted')+'\n';
  if(phone)out+='  Mobile: '+(redactPhone(phone)||'redacted')+'\n';
  out+='  Address: xxx '+(suburb||'xxx')+' '+(state||'')+' '+(postcode||'')+(country?' '+country:'')+'\n';
  if(yearsAtAddress!==null)out+='  Time at Address: '+yearsAtAddress+' years\n';
  out+='\n';

  out+='EMPLOYMENT\n';
  if(employer)out+='  Employer: '+employer+(empABN?' (ABN: '+empABN+')':'')+' (phone redacted)\n';
  out+='  Type: '+(empType||'Unknown')+'\n';
  out+='  Tenure: '+empTenure+'\n';
  if(occupation)out+='  Role: '+occupation+'\n';
  if(industry)out+='  Industry: '+industry+'\n';
  out+='\n';

  out+='INCOME\n';
  if(netIncome){
    out+='  Applicant Net Income: $'+netIncome.toLocaleString()+(incomeFreq?' '+incomeFreq:'')+(incomeSource?' ['+incomeSource+']':'')+'\n';
    if(netIncomeMonthly&amp;&amp;incomeFreq!=='Monthly'){
      out+='  Applicant Monthly Equivalent: $'+netIncomeMonthly.toLocaleString()+'/month\n';
    }
  }else{
    out+='  Applicant Net Income: Not captured\n';
  }
  if(totalIncMonth)out+='  Total Household Monthly Income (applicant + spouse): $'+totalIncMonth+'/month\n';
  out+='\n';

  out+='LIVING\n';
  out+='  Status: '+livingType+livingNote+'\n';
  if(rentAmt)out+='  Amount: $'+rentAmt.toLocaleString()+' '+rentFreq+'\n';
  out+='\n';

  out+='CREDIT FILE\n';
  out+='  Score: '+(creditScore||'Not captured — requires bureau pull')+'\n';
  out+='  File Age: '+fileAge+'\n';
  out+='  Defaults (Financial): '+defaults+'\n';
  out+='  Defaults (Non-Financial): '+nonFinDefaults+'\n';
  out+='  Payday Enquiries: '+payday+'\n';
  out+='  Insolvency: '+insolvency+'\n';
  out+='  ** FHI / Financial Hardship Information on file: '+hardship.toUpperCase()+' ** (if &quot;NO&quot; do not flag FHI as a red flag)\n';
  out+='  Judgements: '+judgements+'\n';
  out+='  Worst CCR (24 months): '+ccr+'\n';
  if(enquiries)out+='  Credit Shopping: '+enquiries+'\n';
  out+='\n';

  out+='LOAN REQUEST\n';
  out+='  Type: '+appType+'\n';
  out+='  Amount: '+(loanAmt?'$'+loanAmt.toLocaleString():'Not found')+'\n';
  if(term)out+='  Term: '+term+' months\n';
  if(condition)out+='  Condition: '+condition+'\n';
  if(saleType)out+='  Sale Type: '+saleType+'\n';
  if(description)out+='  Asset: '+description+'\n';
  if(purchaseCost)out+='  Purchase Cost: $'+purchaseCost.toLocaleString()+'\n';
  if(deposit)out+='  Deposit: $'+deposit.toLocaleString()+'\n';
  if(affordability)out+='  Stated Affordability: $'+affordability+' '+affordFreq+'\n';
  out+='\n';

  out+='LIVING EXPENSES\n';
  Object.entries(expenses).forEach(([k,v])=&gt;{out+='  '+k+': $'+v+'\n'});
  if(totalExpMonth)out+='  Total Monthly Expenses: $'+totalExpMonth+'\n';
  if(uncommittedInc)out+='  Uncommitted Monthly Income: $'+uncommittedInc+'\n';
  out+='\n';

  out+='ASSETS &amp; LIABILITIES\n';
  out+='  Assets declared: '+assetMatches.length+'\n';
  out+='  Liabilities declared: '+debtMatches.length+(debtMatches.length&gt;0?' (account numbers redacted, balances retained in source)':'')+'\n';

  document.getElementById('extractOutput').textContent=out;
  document.getElementById('extractOutput').style.display='block';
  document.getElementById('removedBanner').style.display='block';
  document.getElementById('extractActions').style.display='flex';
  window._lastExtracted=out;
  // Also save the original details for the summary card
  window._summaryFields={
    name:displayName,age:age,citizen:citizen,marital:marital,dependants:dependants,
    employer:employer,empType:empType,empTenure:empTenure,occupation:occupation,industry:industry,
    netIncome:netIncome,incomeFreq:incomeFreq,
    livingType:livingType,rentAmt:rentAmt,rentFreq:rentFreq,
    creditScore:creditScore,fileAge:fileAge,defaults:defaults,
    loanAmt:loanAmt,term:term,asset:description,
    suburb:suburb,state:state,postcode:postcode
  };
}

function copyExtracted(){navigator.clipboard.writeText(window._lastExtracted||'').then(()=&gt;toast('Copied'))}
function autoPasteToMatch(){
  document.getElementById('matchInput').value=window._lastExtracted||'';
  document.querySelectorAll('.pane').forEach(p=&gt;p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=&gt;t.classList.remove('on'));
  document.getElementById('pane-match').classList.add('on');
  document.querySelectorAll('.tab')[1].classList.add('on');
  toast('Pasted into Match tab');
}

// ═══ LENDER MATCHING (Opus 4.6 with structured output) ═══
async function doMatch(){
  const input=document.getElementById('matchInput').value.trim();
  if(!input){toast('Paste a client summary first');return}
  const apiKey=localStorage.getItem('claude_api_key');
  if(!apiKey){toast('Set your API key in Settings first');return}

  const btn=document.getElementById('matchBtn');
  const spinner=document.getElementById('matchSpinner');
  btn.disabled=true;btn.textContent='Matching...';
  spinner.style.display='block';
  document.getElementById('matchResultsArea').style.display='none';

  const systemPrompt=`You are an expert Australian vehicle and asset finance broker's lender matching assistant. Given a sanitised client summary, assess which lenders are likely to approve this applicant.

Return your response as VALID JSON ONLY (no markdown backticks, no preamble) with this exact structure:

{
  &quot;clientSnapshot&quot;: {
    &quot;name&quot;: &quot;string&quot;,
    &quot;age&quot;: &quot;string or number&quot;,
    &quot;employment&quot;: &quot;string — type, tenure, employer name&quot;,
    &quot;income&quot;: &quot;string with $ and frequency&quot;,
    &quot;living&quot;: &quot;string with situation and amount&quot;,
    &quot;credit&quot;: &quot;string — score and key risks&quot;,
    &quot;loan&quot;: &quot;string — amount and asset&quot;,
    &quot;location&quot;: &quot;string — suburb/state&quot;,
    &quot;redFlags&quot;: [&quot;array of 1-line risk concerns or empty array&quot;]
  },
  &quot;strongMatches&quot;: [
    {&quot;lender&quot;: &quot;Money3&quot;, &quot;reasons&quot;: [&quot;Reason 1&quot;, &quot;Reason 2&quot;, &quot;Reason 3&quot;]},
    ...
  ],
  &quot;maybeMatches&quot;: [
    {&quot;lender&quot;: &quot;Latitude&quot;, &quot;reasons&quot;: [&quot;Why it's a maybe&quot;, &quot;What needs strengthening&quot;]},
    ...
  ],
  &quot;notAFit&quot;: [
    {&quot;lender&quot;: &quot;Westpac&quot;, &quot;reasons&quot;: [&quot;Specific failure point&quot;]},
    ...
  ],
  &quot;recommendedOrder&quot;: [&quot;Lender1&quot;, &quot;Lender2&quot;, &quot;Lender3&quot;],
  &quot;submitOrderRationale&quot;: &quot;1-2 sentences explaining the order&quot;,
  &quot;keyRisks&quot;: [&quot;Risk to address before submitting&quot;, &quot;Another risk&quot;],
  &quot;rateRange&quot;: &quot;estimated rate range, e.g. 8.99% - 12.99%&quot;
}

Cover these lenders: Money3, Plenti, Pepper Money, Liberty, Finance One, Now Finance, Latitude, FirstMac, Macquarie, Westpac, ANZ, CommBank, NAB, Angle Finance, Azora, Morris Finance, Metro Finance, Branded Financial, Grow Asset Finance.

CRITICAL CLASSIFICATION RULES:
- Only place a lender in &quot;notAFit&quot; if there is a HARD disqualifier the client cannot fix: insolvency, multiple defaults, sub-threshold credit score, payday loan history, citizenship/visa issues, employment too short for ALL their tiers.
- Loan amount caps are STRUCTURABLE — flag as &quot;Cap is $15K — would need amount reduction&quot; but keep in strong/maybe.
- The broker often works at PRE-APPROVAL stage where vehicle isn't selected yet. DO NOT flag as red flags or risks: missing vehicle details, unknown asset age, no LVR data, no VIN, no purchase price set. These are normal at pre-approval.
- DO NOT mention loan term length as a problem unless it's clearly outside ALL lender ranges. 84-month terms are fine for many Australian lenders (Azora, Money3, Pepper, Liberty, FirstMac).
- DO NOT analyse email domains, dealer relationships, or speculate about related-party sales — focus on the applicant only.
- DO NOT flag &quot;borderline&quot; credit scores as red flags. State the tier (near-prime, prime, etc.) factually if relevant.

RED FLAGS should ONLY include things that are real risks to APPROVAL, not deal structure questions:
- Insolvency, defaults, hardship arrangements
- Income inconsistency or insufficient documentation
- Living expense anomalies that affect serviceability
- Employment gaps or instability
- Credit file issues (multiple recent enquiries, payday loans, judgements)

ABSOLUTELY DO NOT FLAG ANY OF THESE AS RED FLAGS:
- Email domain or what business the email belongs to
- Whether the dealer is wholesale/retail/related party
- Vehicle make/model/year/age/VIN/condition
- Loan term length (60/72/84 months — all fine)
- LVR concerns when no vehicle is selected
- Asset age &quot;not specified&quot;
- Sale type concerns (dealer vs private)
- Loan amount missing — just note it once in snapshot, never red flag
- Living expenses being low, high, or seemingly unrealistic — DO NOT flag this at all. Not a red flag.

HALLUCINATION RULES — READ CAREFULLY:
- The &quot;FHI / Financial Hardship Information on file&quot; line shows the EXACT value. If it says &quot;NO&quot;, there is NO FHI. DO NOT flag FHI as a red flag. DO NOT mention FHI in the credit snapshot except to confirm &quot;no FHI&quot;. Flagging FHI when the data says NO is a critical error.
- If Employment Tenure shows a value like &quot;10m&quot; or &quot;0y 10m&quot;, that's the confirmed tenure — REPORT IT, don't say &quot;not captured&quot;.
- If Applicant Net Income is shown with a frequency like &quot;$1,301.12 Weekly&quot; — that's the CONFIRMED income and frequency. NEVER say frequency is unclear when it's explicitly labeled.
- If &quot;Applicant Monthly Equivalent&quot; is shown, that's the authoritative monthly figure for the APPLICANT ONLY.
- &quot;Total Household Monthly Income (applicant + spouse)&quot; is the COMBINED household figure. Do NOT confuse this with the applicant's own income. When assessing serviceability, use the applicant's figure unless the spouse is a co-applicant.
- DO NOT flag income as inconsistent when both weekly and monthly equivalent are provided — they are meant to match (weekly × 52/12).
- Citizenship and Marital Status are SEPARATE fields. If you see &quot;Citizenship: Citizen&quot; and &quot;Marital Status: De-facto&quot;, treat them as separate. Never say &quot;Citizenship: De-facto&quot; — De-facto is NEVER a citizenship status.
- If the data says &quot;Hardship: No&quot; or doesn't mention hardship — DO NOT say FHI is on file. Only flag FHI if the data explicitly says &quot;Yes&quot;, &quot;Active&quot;, or &quot;FHI Flagged&quot;.
- If employment tenure shows &quot;4m&quot; or &quot;0y 4m&quot;, the person has 4 MONTHS tenure, not 0 months. Parse the full value.
- If Living Type is &quot;Unknown&quot; or &quot;Boarding&quot; with an amount, don't say &quot;rent is missing&quot; — the data captured what it captured. Just report what's there.
- If Credit Score is &quot;Not captured&quot;, say &quot;score not captured, bureau pull required&quot; — don't imply the person has a bad score.
- If data field is missing, say so neutrally. Don't invent negative interpretations of missing data.
- Time at current address of 0 years is NOT a red flag. People move. Don't mention it.
- Number of existing liabilities is NOT a red flag unless there are multiple defaults or arrears.
- DO NOT speculate about serviceability unless you can actually do the math from the captured data.

If a lender has a specific issue with one of these (e.g. &quot;Money3 won't do 84mo on used&quot;), put it in the lender's reasons as a note, NOT in the global red flags.

Be direct and Australian-market specific. Reasons should be SHORT (max 14 words each).
If the loan amount is missing from the data, don't flag it as red — just note it once in the snapshot.`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-4-6',max_tokens:4000,system:systemPrompt,messages:[{role:'user',content:input}]})
    });
    const data=await resp.json();
    if(data.error)throw new Error(data.error.message||'API error');
    let text=data.content.map(c=&gt;c.text||'').join('');
    text=text.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
    // Find JSON object
    const start=text.indexOf('{');
    const end=text.lastIndexOf('}');
    if(start&gt;=0&amp;&amp;end&gt;start)text=text.substring(start,end+1);
    const result=JSON.parse(text);
    window._lastMatchResult=result;
    window._lastMatchInput=input;
    renderResults(result);
  }catch(e){
    document.getElementById('matchResultsArea').innerHTML='&lt;div style=&quot;background:rgba(244,112,103,.1);border:1px solid var(--neg);border-radius:8px;padding:14px;color:var(--neg);font-size:13px&quot;&gt;Error: '+esc(e.message)+'&lt;br&gt;&lt;br&gt;If this looks like a JSON parse error, the AI may have returned unexpected formatting. Try again.&lt;/div&gt;';
    document.getElementById('matchResultsArea').style.display='block';
  }finally{
    btn.disabled=false;btn.textContent='Match Lenders';
    spinner.style.display='none';
  }
}

function renderResults(r){
  const cs=r.clientSnapshot||{};
  let html='';

  // === CLIENT SUMMARY CARD ===
  html+='&lt;div class=&quot;client-summary-card&quot;&gt;&lt;h3&gt;Client Snapshot&lt;/h3&gt;&lt;div class=&quot;summary-grid&quot;&gt;';
  if(cs.name)html+='&lt;div class=&quot;summary-item&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Name&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;'+esc(cs.name)+'&lt;/div&gt;&lt;/div&gt;';
  if(cs.age)html+='&lt;div class=&quot;summary-item&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Age&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;'+esc(cs.age)+'&lt;/div&gt;&lt;/div&gt;';
  if(cs.location)html+='&lt;div class=&quot;summary-item&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Location&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;'+esc(cs.location)+'&lt;/div&gt;&lt;/div&gt;';
  if(cs.employment)html+='&lt;div class=&quot;summary-item&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Employment&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;'+esc(cs.employment)+'&lt;/div&gt;&lt;/div&gt;';
  if(cs.income)html+='&lt;div class=&quot;summary-item&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Income&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;'+esc(cs.income)+'&lt;/div&gt;&lt;/div&gt;';
  if(cs.living)html+='&lt;div class=&quot;summary-item&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Living&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;'+esc(cs.living)+'&lt;/div&gt;&lt;/div&gt;';
  if(cs.credit)html+='&lt;div class=&quot;summary-item&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Credit&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;'+esc(cs.credit)+'&lt;/div&gt;&lt;/div&gt;';

      html+='&lt;/ul&gt;&lt;/div&gt;';

  // === MAYBE ===

      html+='&lt;/ul&gt;&lt;/div&gt;';
    });
    html+='&lt;/div&gt;';
  }

  // === NOT A FIT ===
  const not=r.notAFit||[];
  if(not.length){
    html+='&lt;div class=&quot;section-h neg&quot;&gt;✗ Not A Fit &lt;span class=&quot;count&quot;&gt;'+not.length+'&lt;/span&gt;&lt;/div&gt;';
    html+='&lt;div class=&quot;lender-grid&quot;&gt;';

function buildCRMText(){
  const r=window._lastMatchResult;if(!r)return'';
  const ref=document.getElementById('clientRef')?.value||'Client';
  let t='LENDER ASSESSMENT — '+ref+'\nDate: '+new Date().toLocaleDateString('en-AU')+'\n\n';
  if(r.clientSnapshot){
    const cs=r.clientSnapshot;
    t+='CLIENT SNAPSHOT\n';
    if(cs.name)t+='Name: '+cs.name+'\n';
    if(cs.age)t+='Age: '+cs.age+'\n';
    if(cs.employment)t+='Employment: '+cs.employment+'\n';
    if(cs.income)t+='Income: '+cs.income+'\n';
    if(cs.living)t+='Living: '+cs.living+'\n';
    if(cs.credit)t+='Credit: '+cs.credit+'\n';
    if(cs.loan)t+='Loan: '+cs.loan+'\n';
    t+='\n';
  }
  if((r.strongMatches||[]).length){
    t+='✓ STRONG MATCHES\n';
    r.strongMatches.forEach(l=&gt;{t+='• '+l.lender+'\n';(l.reasons||[]).forEach(rs=&gt;{t+='   - '+rs+'\n'})});
    t+='\n';
  }
  if((r.maybeMatches||[]).length){
    t+='⚠ MAYBE\n';
    r.maybeMatches.forEach(l=&gt;{t+='• '+l.lender+'\n';(l.reasons||[]).forEach(rs=&gt;{t+='   - '+rs+'\n'})});
    t+='\n';
  }
  if((r.notAFit||[]).length){
    t+='✗ NOT A FIT\n';
    r.notAFit.forEach(l=&gt;{t+='• '+l.lender+'\n';(l.reasons||[]).forEach(rs=&gt;{t+='   - '+rs+'\n'})});
    t+='\n';
  }
  if((r.recommendedOrder||[]).length){
    t+='SUBMIT ORDER: '+r.recommendedOrder.join(' → ')+'\n';
    if(r.submitOrderRationale)t+=r.submitOrderRationale+'\n';
    t+='\n';
  }
  if((r.keyRisks||[]).length){
    t+='KEY RISKS:\n';r.keyRisks.forEach(k=&gt;{t+='• '+k+'\n'});t+='\n';
  }
  if(r.rateRange)t+='Rate Range Estimate: '+r.rateRange+'\n';
  return t;
}

function saveResult(){
  const ref=document.getElementById('clientRef').value.trim();
  if(!ref){toast('Enter a client reference');return}
  const saved=JSON.parse(localStorage.getItem('lender_saved_results')||'[]');
  saved.unshift({ref,date:new Date().toISOString(),input:window._lastMatchInput||'',result:window._lastMatchResult||{},text:buildCRMText()});
  localStorage.setItem('lender_saved_results',JSON.stringify(saved));
  toast('Saved: '+ref);
}
function copyForCRM(){navigator.clipboard.writeText(buildCRMText()).then(()=&gt;toast('Copied for CRM'))}

// ═══ SAVED LIST ═══
function renderSaved(){
  const saved=JSON.parse(localStorage.getItem('lender_saved_results')||'[]');
  const el=document.getElementById('savedList');
  if(!saved.length){el.innerHTML='&lt;p style=&quot;color:var(--mut);font-size:13px&quot;&gt;No saved assessments yet.&lt;/p&gt;';return}
  el.innerHTML=saved.map((s,i)=&gt;{
    const d=new Date(s.date);
    const preview=s.text?s.text.substring(0,140):JSON.stringify(s.result).substring(0,140);
    return'&lt;div class=&quot;saved-item&quot;&gt;&lt;div style=&quot;display:flex;justify-content:space-between;align-items:center&quot;&gt;&lt;div&gt;&lt;span class=&quot;ref&quot;&gt;'+esc(s.ref)+'&lt;/span&gt;&lt;span class=&quot;date&quot; style=&quot;margin-left:10px&quot;&gt;'+d.toLocaleDateString('en-AU')+' '+d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})+'&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;gap:6px&quot;&gt;&lt;button class=&quot;btn btn-sm btn-outline&quot; onclick=&quot;loadSaved('+i+')&quot;&gt;View&lt;/button&gt;&lt;button class=&quot;btn btn-sm btn-outline&quot; onclick=&quot;copySavedResult('+i+')&quot;&gt;Copy&lt;/button&gt;&lt;button class=&quot;btn btn-sm btn-outline&quot; style=&quot;color:var(--neg);border-color:rgba(244,112,103,.3)&quot; onclick=&quot;deleteSaved('+i+')&quot;&gt;Delete&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;preview&quot;&gt;'+esc(preview)+'...&lt;/div&gt;&lt;/div&gt;';
  }).join('');
}
function loadSaved(i){
  const saved=JSON.parse(localStorage.getItem('lender_saved_results')||'[]');
  if(saved[i]){
    window._lastMatchResult=saved[i].result;
    window._lastMatchInput=saved[i].input;
    document.getElementById('matchInput').value=saved[i].input||'';
    renderResults(saved[i].result);
    document.querySelectorAll('.pane').forEach(p=&gt;p.classList.remove('on'));
    document.querySelectorAll('.tab').forEach(t=&gt;t.classList.remove('on'));
    document.getElementById('pane-match').classList.add('on');
    document.querySelectorAll('.tab')[1].classList.add('on');
    setTimeout(()=&gt;{const ref=document.getElementById('clientRef');if(ref)ref.value=saved[i].ref},100);
  }
}
function copySavedResult(i){
  const saved=JSON.parse(localStorage.getItem('lender_saved_results')||'[]');
  if(saved[i]&amp;&amp;saved[i].text)navigator.clipboard.writeText(saved[i].text).then(()=&gt;toast('Copied'));
}
function deleteSaved(i){
  const saved=JSON.parse(localStorage.getItem('lender_saved_results')||'[]');
  if(confirm('Delete assessment for &quot;'+saved[i].ref+'&quot;?')){saved.splice(i,1);localStorage.setItem('lender_saved_results',JSON.stringify(saved));renderSaved();toast('Deleted')}
}
function exportSaved(){
  const saved=JSON.parse(localStorage.getItem('lender_saved_results')||'[]');
  const blob=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lender_assessments_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  toast('Exported '+saved.length+' assessments');
}
function importSaved(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    try{const data=JSON.parse(r.result);const existing=JSON.parse(localStorage.getItem('lender_saved_results')||'[]');const merged=[...data,...existing];localStorage.setItem('lender_saved_results',JSON.stringify(merged));renderSaved();toast('Imported '+data.length+' assessments')}
    catch(e){toast('Invalid file')}
  };r.readAsText(f);
}


// === FILE UPLOAD HANDLERS ===
function handleDrop(e){
  e.preventDefault();
  document.getElementById('uploadZone').style.borderColor='#252a38';
  handleFiles(e.dataTransfer.files);
}

async function handleFiles(files){
  if(!files||!files.length)return;
  const progress=document.getElementById('extractProgress');
  const ta=document.getElementById('rawInput');
  let allText='';
  for(let i=0;i&lt;files.length;i++){
    const f=files[i];
    progress.style.display='block';
    progress.innerHTML='&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt;Processing '+(i+1)+' of '+files.length+': '+f.name;
    try{
      let text='';
      if(f.type==='application/pdf'){
        text=await extractPdf(f);
      }else if(f.type.startsWith('image/')){
        text=await extractImage(f);
      }
      allText+='\n\n=== FROM '+f.name+' ===\n'+text;
    }catch(e){
      allText+='\n\n=== ERROR processing '+f.name+': '+e.message+' ===';
    }
  }
  progress.innerHTML='✓ Extracted '+files.length+' file(s). Click &quot;Extract &amp; Sanitise&quot; below.';
  setTimeout(()=&gt;{progress.style.display='none'},3000);
  ta.value=(ta.value+allText).trim();
}

async function extractPdf(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let text='';
  for(let p=1;p&lt;=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    const pageText=content.items.map(it=&gt;it.str).join('\n');
    text+=pageText+'\n';
  }
  return text;
}

async function extractImage(file){
  const result=await Tesseract.recognize(file,'eng',{
    logger:m=&gt;{
      if(m.status==='recognizing text'){
        const p=document.getElementById('extractProgress');
        if(p&amp;&amp;p.style.display!=='none')p.innerHTML='&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt;OCR: '+Math.round(m.progress*100)+'%';
      }
    }
  });
  return result.data.text;
}

&lt;div class=&quot;toast&quot; id=&quot;toast&quot;&gt;&lt;/div&gt;

&lt;script&gt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=&gt;t.classList.remove('show'),2200)}
function esc(s){return s?String(s).replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;').replace(/&gt;/g,'&amp;gt;'):''}

let activeStage='s1';
let editingId=null;
const STORAGE_KEY='broker_templates_v2';

function getAllTpls(){try{const stored=JSON.parse(localStorage.getItem(STORAGE_KEY));if(stored)return stored}catch(e){}return JSON.parse(JSON.stringify(SEED_TEMPLATES))}
function saveAllTpls(t){localStorage.setItem(STORAGE_KEY,JSON.stringify(t))}

function renderStageNav(){
  const el=document.getElementById('stageNav');
  el.innerHTML=STAGES.map(s=&gt;'&lt;button class=&quot;stage-btn'+(s.alt?' alt':'')+(activeStage===s.id?' on':'')+'&quot; onclick=&quot;selectStage(\''+s.id+'\')&quot;&gt;&lt;span class=&quot;stage-num&quot;&gt;'+s.num+'&lt;/span&gt;'+esc(s.name)+'&lt;/button&gt;').join('');
}

function selectStage(id){
  activeStage=id;
  cancelEdit();
  renderStageNav();
  renderStage();
}

function renderStage(){
  const stage=STAGES.find(s=&gt;s.id===activeStage);
  if(!stage){document.getElementById('stageContent').innerHTML='';return}
  const all=getAllTpls();
  const tpls=all[stage.id]||[];
  let html='&lt;div class=&quot;stage-head&quot;&gt;&lt;div&gt;&lt;h2&gt;&lt;span&gt;'+stage.icon+'&lt;/span&gt;'+esc(stage.name)+(stage.alt?'&lt;span class=&quot;stage-tag alt&quot;&gt;Alternate Path&lt;/span&gt;':'&lt;span class=&quot;stage-tag&quot;&gt;Stage '+stage.num+'&lt;/span&gt;')+'&lt;/h2&gt;&lt;div class=&quot;stage-desc&quot;&gt;'+esc(stage.desc)+'&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;';
  if(stage.id==='s16'){html+='&lt;div class=&quot;empty&quot;&gt;No client message at this stage. Internal CRM note only.&lt;/div&gt;';document.getElementById('stageContent').innerHTML=html;return}
  if(!tpls.length){html+='&lt;div class=&quot;empty&quot;&gt;No templates for this stage. Click &quot;+ Add Custom Template&quot; above to add one.&lt;/div&gt;';document.getElementById('stageContent').innerHTML=html;return}
  tpls.forEach((t,i)=&gt;{
    const hasSms=t.sms&amp;&amp;t.sms.trim();
    const hasEmail=(t.email&amp;&amp;t.email.trim())||(t.subject&amp;&amp;t.subject.trim());
    const onlyClass=(hasSms&amp;&amp;!hasEmail)?'sms-only':((!hasSms&amp;&amp;hasEmail)?'email-only':'');
    html+='&lt;div class=&quot;tpl-card '+onlyClass+'&quot;&gt;&lt;div class=&quot;card-head&quot;&gt;&lt;div class=&quot;card-title&quot;&gt;&lt;span class=&quot;ev-num&quot;&gt;'+(i+1)+'&lt;/span&gt;'+esc(t.title)+'&lt;/div&gt;';
    html+='&lt;div class=&quot;card-actions&quot;&gt;&lt;button class=&quot;btn btn-sm btn-outline&quot; onclick=&quot;editTpl(\''+t.id+'\')&quot;&gt;Edit&lt;/button&gt;';
    if(t.custom){html+='&lt;button class=&quot;btn btn-sm btn-neg&quot; onclick=&quot;deleteTpl(\''+t.id+'\')&quot;&gt;Delete&lt;/button&gt;';}
    else{html+='&lt;button class=&quot;btn btn-sm btn-outline&quot; style=&quot;opacity:.6&quot; onclick=&quot;resetTpl(\''+t.id+'\')&quot; title=&quot;Restore original from seed&quot;&gt;Reset&lt;/button&gt;';}
    html+='&lt;/div&gt;';
    html+='&lt;/div&gt;&lt;div class=&quot;card-body&quot;&gt;';
    // SMS column
    if(hasSms||(!hasSms&amp;&amp;!hasEmail)){
      html+='&lt;div class=&quot;msg-block sms&quot;&gt;&lt;div class=&quot;msg-label sms&quot;&gt;&lt;span class=&quot;ico&quot;&gt;📱&lt;/span&gt;SMS&lt;/div&gt;';
      if(hasSms){
        html+='&lt;div class=&quot;msg-body&quot;&gt;'+esc(t.sms)+'&lt;/div&gt;&lt;div class=&quot;msg-actions&quot;&gt;&lt;button class=&quot;btn btn-sm&quot; onclick=&quot;copyMsg(\''+t.id+'\',\'sms\')&quot;&gt;Copy SMS&lt;/button&gt;&lt;/div&gt;';
      }else{
        html+='&lt;div class=&quot;no-msg&quot;&gt;No SMS for this event&lt;/div&gt;';
      }
      html+='&lt;/div&gt;';
    }
    // Email column
    if(hasEmail){
      html+='&lt;div class=&quot;msg-block email&quot;&gt;&lt;div class=&quot;msg-label email&quot;&gt;&lt;span class=&quot;ico&quot;&gt;✉️&lt;/span&gt;Email&lt;/div&gt;';
      if(t.subject)html+='&lt;div class=&quot;msg-subject&quot;&gt;&lt;b&gt;Subject:&lt;/b&gt; '+esc(t.subject)+'&lt;/div&gt;';
      html+='&lt;div class=&quot;msg-body&quot;&gt;'+esc(t.email||'')+'&lt;/div&gt;&lt;div class=&quot;msg-actions&quot;&gt;&lt;button class=&quot;btn btn-sm&quot; onclick=&quot;copyMsg(\''+t.id+'\',\'email\')&quot;&gt;Copy Email&lt;/button&gt;&lt;button class=&quot;btn btn-sm btn-outline&quot; onclick=&quot;copyMsg(\''+t.id+'\',\'email-full\')&quot;&gt;Copy w/ Subject&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;';
    }else if(hasSms){
      // SMS-only — don't show empty email block
    }
    html+='&lt;/div&gt;&lt;/div&gt;';
  });
  document.getElementById('stageContent').innerHTML=html;
}

function copyMsg(id,kind){
  const all=getAllTpls();
  const tpls=all[activeStage]||[];
  const t=tpls.find(x=&gt;x.id===id);
  if(!t)return;
  let txt='';
  if(kind==='sms')txt=t.sms||'';
  else if(kind==='email')txt=t.email||'';
  else if(kind==='email-full')txt='Subject: '+(t.subject||'')+'\n\n'+(t.email||'');
  navigator.clipboard.writeText(txt).then(()=&gt;toast('Copied'));
}

// === CRUD for custom templates ===
function addCustomTpl(){
  editingId=null;
  document.getElementById('editorTitle').textContent='New Custom Template — '+(STAGES.find(s=&gt;s.id===activeStage)?.name||'');
  document.getElementById('edTitle').value='';
  document.getElementById('edSms').value='';
  document.getElementById('edSubject').value='';
  document.getElementById('edEmail').value='';
  document.getElementById('editor').classList.add('on');
  document.getElementById('edTitle').focus();
}

function editTpl(id){
  const all=getAllTpls();
  const t=(all[activeStage]||[]).find(x=&gt;x.id===id);
  if(!t)return;
  editingId=id;
  document.getElementById('editorTitle').textContent='Edit Template';
  document.getElementById('edTitle').value=t.title||'';
  document.getElementById('edSms').value=t.sms||'';
  document.getElementById('edSubject').value=t.subject||'';
  document.getElementById('edEmail').value=t.email||'';
  document.getElementById('editor').classList.add('on');
  document.getElementById('editor').scrollIntoView({behavior:'smooth',block:'center'});
}

function saveCustomTpl(){
  const title=document.getElementById('edTitle').value.trim();
  const sms=document.getElementById('edSms').value.trim();
  const subject=document.getElementById('edSubject').value.trim();
  const email=document.getElementById('edEmail').value.trim();
  if(!title){toast('Title required');return}
  if(!sms&amp;&amp;!email){toast('Add at least an SMS or Email');return}
  const all=getAllTpls();
  if(!all[activeStage])all[activeStage]=[];
  const tpl={id:editingId||('c_'+Date.now()),title,sms,subject,email,custom:true};
  if(editingId){
    const idx=all[activeStage].findIndex(x=&gt;x.id===editingId);
    if(idx&gt;=0)all[activeStage][idx]=tpl;
  }else{
    all[activeStage].push(tpl);
  }
  saveAllTpls(all);
  cancelEdit();
  renderStage();
  toast('Saved');
}


function resetTpl(id){
  if(!confirm('Reset this template back to the original?'))return;
  const all=getAllTpls();
  const original=SEED_TEMPLATES[activeStage]?(SEED_TEMPLATES[activeStage].find(x=&gt;x.id===id)):null;
  if(!original){toast('No original to restore');return}
  const idx=(all[activeStage]||[]).findIndex(x=&gt;x.id===id);
  if(idx&gt;=0){all[activeStage][idx]={...original};saveAllTpls(all);renderStage();toast('Reset to original')}
}

function deleteTpl(id){
  const all=getAllTpls();
  const t=(all[activeStage]||[]).find(x=&gt;x.id===id);
  if(!t||!confirm('Delete &quot;'+t.title+'&quot;?'))return;
  all[activeStage]=all[activeStage].filter(x=&gt;x.id!==id);
  saveAllTpls(all);
  renderStage();
  toast('Deleted');
}

function cancelEdit(){document.getElementById('editor').classList.remove('on');editingId=null}

function insertVar(target,v){
  const ta=document.getElementById(target);
  const start=ta.selectionStart,end=ta.selectionEnd;
  ta.value=ta.value.substring(0,start)+v+ta.value.substring(end);
  ta.focus();ta.setSelectionRange(start+v.length,start+v.length);
}

function exportTemplates(){
  const all=getAllTpls();
  const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='broker_templates_v2_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  toast('Exported');
}
function importTemplates(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const data=JSON.parse(r.result);
      saveAllTpls(data);
      renderStage();renderStageNav();
      toast('Imported');
    }catch(e){toast('Invalid file')}
  };r.readAsText(f);
}

renderStageNav();
renderStage();

er last week \u2014 worth confirming we're still the preferred option&quot;,&quot;when&quot;:&quot;14 Apr&quot;}],&quot;updates&quot;:[{&quot;date&quot;:&quot;2026-04-10T10:30:00.000Z&quot;,&quot;input&quot;:&quot;Initial discovery call. Strong fit, clear on what he wants.&quot;,&quot;summary&quot;:&quot;First contact, qualified strongly&quot;},{&quot;date&quot;:&quot;2026-04-12T14:15:00.000Z&quot;,&quot;input&quot;:&quot;Sent docs request. He returned them same day with payslips, ID, bank stmts.&quot;,&quot;summary&quot;:&quot;Docs received same-day \u2014 high engagement&quot;},{&quot;date&quot;:&quot;2026-04-14T09:45:00.000Z&quot;,&quot;input&quot;:&quot;Follow-up call. Mentioned competitor broker by name. Reassured on our turnaround.&quot;,&quot;summary&quot;:&quot;Competitor pressure surfacing \u2014 held position&quot;}],&quot;lastUpdated&quot;:&quot;2026-04-14T09:45:00.000Z&quot;,&quot;dob&quot;:&quot;1991-01-08&quot;},&quot;L-0004&quot;:{&quot;story&quot;:&quot;Caleb came in cold from a Google ad \u2014 2024 Ford Everest for $55,000. First impression was guarded; she'd had a bad experience with a previous broker who'd promised a rate they couldn't deliver. The first 2 weeks were slow \u2014 she ghosted twice before re-engaging. The breakthrough was when we sent a video walkthrough of the loan structure rather than another text chase. Once trust was built, the rest moved fast. Settled with Metro Finance at $53,799 on a 60-month term. She left a 5-star review and referred her sister within the week.&quot;,&quot;communicationCoaching&quot;:{&quot;channel&quot;:&quot;video / email&quot;,&quot;tone&quot;:&quot;warm and patient&quot;,&quot;timing&quot;:&quot;Evenings preferred \u2014 works retail shifts during the day&quot;,&quot;tip&quot;:&quot;(Settled) For similar profiles in future: skip the text chase early. Send a 60-second video explainer instead \u2014 it builds trust faster than written promises with someone burned before.&quot;},&quot;starSign&quot;:{&quot;sign&quot;:&quot;Cancer&quot;,&quot;lens&quot;:&quot;Cancer traits visible throughout \u2014 cautious, emotion-led, values security and trust over speed. The breakthrough only came after she felt seen as a person, not a deal. Pattern to watch for in similar clients.&quot;},&quot;mood&quot;:{&quot;icon&quot;:&quot;\u2705&quot;,&quot;label&quot;:&quot;Settled \u2014 high trust&quot;,&quot;trend&quot;:&quot;Closed strong. Already referred her sister.&quot;},&quot;inconsistencies&quot;:[],&quot;updates&quot;:[{&quot;date&quot;:&quot;2026-03-02T11:00:00.000Z&quot;,&quot;input&quot;:&quot;First contact \u2014 guarded, mentioned bad past experience&quot;,&quot;summary&quot;:&quot;Cold lead, trust low&quot;},{&quot;date&quot;:&quot;2026-03-08T15:30:00.000Z&quot;,&quot;input&quot;:&quot;Ghosted for 6 days. Re-engaged after follow-up.&quot;,&quot;summary&quot;:&quot;Re-engaged after silence&quot;},{&quot;date&quot;:&quot;2026-03-15T10:00:00.000Z&quot;,&quot;input&quot;:&quot;Sent video walkthrough. Big shift in tone.&quot;,&quot;summary&quot;:&quot;Video unlocked the relationship&quot;},{&quot;date&quot;:&quot;2026-03-22T13:45:00.000Z&quot;,&quot;input&quot;:&quot;Conditional approval. She asked good questions about insurance.&quot;,&quot;summary&quot;:&quot;Approval landed, engaged on detail&quot;},{&quot;date&quot;:&quot;2026-03-28T16:00:00.000Z&quot;,&quot;input&quot;:&quot;Settled. 5-star review left same day. Sister enquiry came in 4 days later.&quot;,&quot;summary&quot;:&quot;Settled and referred&quot;}],&quot;postmortem&quot;:{&quot;dealSummary&quot;:&quot;Cold lead from Google ad with low initial trust due to past broker disappointment. Took 26 days from first contact to settlement, with two ghosting periods early on. Breakthrough came from switching from text-based chase to a personal video walkthrough on day 13. Settled on 60-month term and generated a referral within a week.&quot;,&quot;communicationWins&quot;:[&quot;Switching to video walkthrough on day 13 \u2014 text chase was eroding trust further; video built rapport instantly&quot;,&quot;Acknowledging her past broker experience explicitly rather than glossing over it \u2014 she felt heard&quot;,&quot;Sending evening messages (after 7pm) once we learned her work schedule \u2014 got faster responses&quot;,&quot;Quoting a rate range with caveats early instead of a single number \u2014 managed expectations and built credibility&quot;],&quot;communicationMisses&quot;:[&quot;First three days of text chases probably reinforced her negative impression \u2014 should have gone to phone or video sooner&quot;,&quot;Initial doc request email was too generic \u2014 could have been more personalised given the trust signals already showing&quot;],&quot;problemsFaced&quot;:[&quot;Ghosting twice in the first 2 weeks \u2014 clear sign of low trust, not low interest&quot;,&quot;Past broker had quoted unrealistic rate which set baseline expectation too low&quot;,&quot;Banking showed irregular shift work income which slowed serviceability calc&quot;,&quot;Initial lender (Money3) declined on tenure \u2014 had to pivot to alternative&quot;],&quot;preventionLessons&quot;:[&quot;When a client mentions a previous bad broker experience in the first call, default to phone/video over text from day one&quot;,&quot;For shift workers with irregular income, request 6 months of statements upfront rather than 3 \u2014 saves a re-request later&quot;,&quot;Always ask 'what rate did the previous broker quote you?' so you know what expectation you're working against&quot;,&quot;Build a 60-second video template explaining 'how I work' that you can send to nervy first-timers \u2014 saves typing the same reassurance over and over&quot;,&quot;If a client ghosts after document request, send ONE follow-up at the 48-hour mark, then go silent for 5 days before re-engaging \u2014 chasing too hard pushes them further away&quot;],&quot;clientArchetype&quot;:{&quot;label&quot;:&quot;The Burned Returner&quot;,&quot;description&quot;:&quot;Has tried finance brokers before with a poor outcome. Initially defensive, slow to engage, and tests you with silence. Once trust is established, becomes one of your most loyal and referral-generating clients. Patience and a personal touch beats any hard close.&quot;},&quot;generatedAt&quot;:&quot;2026-03-29T10:00:00.000Z&quot;},&quot;lastUpdated&quot;:&quot;2026-03-28T16:00:00.000Z&quot;,&quot;dob&quot;:&quot;1988-07-14&quot;},&quot;L-0006&quot;:{&quot;story&quot;:&quot;Bianca was a referral from a previous client. ABN of 18 months running a small landscaping business, looking at a 2022 Mazda BT-50 for the work ute. Cash flow was strong but documentation was a nightmare \u2014 accountant was slow, BAS statements were inconsistent, and we had to chase paperwork for 3 weeks. Personality was warm and easygoing throughout but the file was high-touch. Eventually settled with FirstMac at $27,652. The settlement was satisfying but the labour cost was high \u2014 would price-tag this kind of file differently next time.&quot;,&quot;communicationCoaching&quot;:{&quot;channel&quot;:&quot;SMS&quot;,&quot;tone&quot;:&quot;casual and friendly&quot;,&quot;timing&quot;:&quot;Anytime \u2014 he replies fast, often after-hours&quot;,&quot;tip&quot;:&quot;(Settled) For self-employed referrals: get the accountant's contact details on the first call so you can chase docs directly. Don't rely on the client to chase their own accountant.&quot;},&quot;starSign&quot;:{&quot;sign&quot;:&quot;Sagittarius&quot;,&quot;lens&quot;:&quot;Sagittarius optimism visible throughout \u2014 easygoing, big-picture, allergic to admin detail. This is exactly the personality that struggles with self-employed documentation requirements. Plan for it.&quot;},&quot;mood&quot;:{&quot;icon&quot;:&quot;\u2705&quot;,&quot;label&quot;:&quot;Settled \u2014 happy customer&quot;,&quot;trend&quot;:&quot;Closed, but lots of work along the way.&quot;},&quot;inconsistencies&quot;:[],&quot;updates&quot;:[{&quot;date&quot;:&quot;2026-02-10T09:00:00.000Z&quot;,&quot;input&quot;:&quot;Referral from John K. Quick first call \u2014 easygoing, ute for landscaping business.&quot;,&quot;summary&quot;:&quot;Warm referral, strong fit on paper&quot;},{&quot;date&quot;:&quot;2026-02-15T14:00:00.000Z&quot;,&quot;input&quot;:&quot;Docs request. He sent only some of them. Said accountant was slow.&quot;,&quot;summary&quot;:&quot;First doc request - partial response&quot;},{&quot;date&quot;:&quot;2026-02-22T10:30:00.000Z&quot;,&quot;input&quot;:&quot;Still waiting on BAS. Chased again.&quot;,&quot;summary&quot;:&quot;Doc chase #2&quot;},{&quot;date&quot;:&quot;2026-03-05T11:00:00.000Z&quot;,&quot;input&quot;:&quot;BAS finally arrived. Inconsistent figures vs accountant prep.&quot;,&quot;summary&quot;:&quot;Docs landed but quality issue&quot;},{&quot;date&quot;:&quot;2026-03-18T13:00:00.000Z&quot;,&quot;input&quot;:&quot;Settled with FirstMac. He thanked me with a six-pack.&quot;,&quot;summary&quot;:&quot;Settled - high-touch deal&quot;}],&quot;postmortem&quot;:{&quot;dealSummary&quot;:&quot;Self-employed referral with strong personal fit but extensive documentation chasing. Took 36 days from first contact to settlement due to slow accountant and inconsistent BAS records. Settled successfully but consumed roughly 3x the labour of an average PAYG client. Customer was delighted, referred more business since.&quot;,&quot;communicationWins&quot;:[&quot;Kept the tone warm and casual throughout \u2014 never made him feel like he was being chased even when chasing&quot;,&quot;Used SMS as the primary channel after noticing he replied to texts within minutes but emails took days&quot;,&quot;When BAS came back inconsistent, called him to talk it through rather than emailing a list of issues \u2014 kept the relationship strong&quot;],&quot;communicationMisses&quot;:[&quot;Should have asked for accountant's direct contact details on first call so I could chase paperwork directly&quot;,&quot;Took too long to escalate the document delays \u2014 could have offered to do a 3-way call with the accountant a week earlier&quot;],&quot;problemsFaced&quot;:[&quot;Accountant was slow and unresponsive \u2014 bottleneck for 3 weeks&quot;,&quot;BAS statements showed inconsistent figures vs the accountant-prepared income summary&quot;,&quot;Self-employed serviceability calc had to be re-run twice as new figures came in&quot;,&quot;Initial lender choice (Pepper) was actually a poor fit for ABN under 2 years \u2014 wasted a credit hit&quot;],&quot;preventionLessons&quot;:[&quot;On all self-employed enquiries, get the accountant's direct contact details on the first call \u2014 chase docs broker-to-accountant&quot;,&quot;For ABNs under 2 years, only submit to lenders with explicit short-ABN appetite \u2014 Pepper, Money3, Liberty. Don't waste credit hits on mainstream lenders&quot;,&quot;Request BAS for last 4 quarters, not just 2 \u2014 gives more pattern recognition and saves re-requests&quot;,&quot;When documentation lag exceeds 2 weeks, schedule a 3-way call with client + accountant \u2014 usually unblocks within 48 hours&quot;,&quot;Add a 'self-employed file' tag in CRM to flag these for the higher labour cost \u2014 useful for capacity planning&quot;],&quot;clientArchetype&quot;:{&quot;label&quot;:&quot;The Easygoing Landlord-of-Chaos&quot;,&quot;description&quot;:&quot;Self-employed, warm personality, easy to like. Documentation is always a mess but they're not being deliberately difficult \u2014 they just live in their craft, not their admin. High-touch but high-loyalty when they settle. Build process around the chaos rather than fighting it.&quot;},&quot;generatedAt&quot;:&quot;2026-03-19T15:00:00.000Z&quot;},&quot;lastUpdated&quot;:&quot;2026-03-18T13:00:00.000Z&quot;,&quot;dob&quot;:&quot;1985-12-03&quot;}};
  if (!localStorage.getItem('demo_brains_seeded_v2')) {

&lt;script&gt;
let clients=[];
let selectedId=null;
window._showAll=false;
const BROKER_NAME='Jordy';

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=&gt;t.classList.remove('show'),2400)}
function esc(s){return s?String(s).replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;').replace(/&gt;/g,'&amp;gt;'):''}

async function loadClients(){
  try{
    const cached=localStorage.getItem('client_stories_list');
    if(cached){clients=JSON.parse(cached);renderList();return}
  }catch(e){}
  document.getElementById('clientList').innerHTML='&lt;div style=&quot;padding:20px;color:var(--mut);font-size:12px;text-align:center&quot;&gt;No data yet.&lt;br&gt;&lt;br&gt;Open the &lt;b&gt;Dashboard&lt;/b&gt; tab first to load lead data.&lt;/div&gt;';
}

window.addEventListener('message',function(e){
  if(e.data&amp;&amp;e.data.type==='leadsData'&amp;&amp;e.data.leads){
    clients=e.data.leads;
    localStorage.setItem('client_stories_list',JSON.stringify(clients));
    renderList();
  }
});

function renderList(){
  const search=document.getElementById('clientSearch').value.toLowerCase();
  const activeStages=['New','Contacted','Qualified','Submitted','Approved'];
  let filtered=clients.filter(c=&gt;{
    if(!window._showAll){
      const stage=c.stage||'New';
      const isActive=activeStages.includes(stage)||(!c.finalStatus||c.finalStatus==='Open');
      if(!isActive)return false;
    }
    if(search&amp;&amp;!(c.name||'').toLowerCase().includes(search))return false;
    return true;
  });
  const el=document.getElementById('clientList');
  if(!filtered.length){el.innerHTML='&lt;div style=&quot;padding:20px;color:var(--mut);font-size:12px;text-align:center&quot;&gt;'+(search?'No matches':'No active clients')+'&lt;/div&gt;';return}
  el.innerHTML=filtered.map(c=&gt;{
    const brain=getBrain(c.id);
    const hasBrain=brain&amp;&amp;(brain.story||brain.updates&amp;&amp;brain.updates.length);
    const stage=c.stage||'New';
    const badgeClass={'New':'badge-new','Contacted':'badge-new','Qualified':'badge-qual','Submitted':'badge-sub','Approved':'badge-app','Settled':'badge-set','Lost':'badge-lost'}[stage]||'badge-new';
    return'&lt;div class=&quot;sb-item'+(selectedId===c.id?' on':'')+'&quot; onclick=&quot;selectClient(\''+(c.id||'').toString().replace(/\'/g,&quot;\\\\'&quot;)+'\')&quot;&gt;'
      +'&lt;div class=&quot;name&quot;&gt;'+(hasBrain?'&lt;span class=&quot;brain-dot&quot;&gt;&lt;/span&gt;':'')+esc(c.name)+'&lt;/div&gt;'
      +'&lt;div class=&quot;meta&quot;&gt;&lt;span class=&quot;badge-sm '+badgeClass+'&quot;&gt;'+esc(stage)+'&lt;/span&gt;'
      +(c.requested?'&lt;span&gt;$'+Number(c.requested).toLocaleString()+'&lt;/span&gt;':'')
      +'&lt;/div&gt;&lt;/div&gt;';
  }).join('');
}

// === BRAIN STORAGE ===
function getBrain(id){try{return JSON.parse(localStorage.getItem('brain_'+id))||null}catch(e){return null}}
function saveBrain(id,b){localStorage.setItem('brain_'+id,JSON.stringify(b))}

function parseDate(s){if(!s)return null;if(s instanceof Date)return s;const m=String(s).match(/(\d{1,2})[-\/]([A-Za-z]+|\d{1,2})[-\/](\d{2,4})/);if(!m)return null;const months={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};let mm=parseInt(m[2])-1;if(isNaN(mm))mm=months[m[2].toLowerCase().slice(0,3)];let yy=parseInt(m[3]);if(yy&lt;100)yy+=2000;const d=new Date(yy,mm,parseInt(m[1]));return isNaN(d)?null:d}
function daysBetween(d1,d2){if(!d1||!d2)return null;return Math.floor((d2-d1)/(1000*60*60*24))}


// === REDACTION HELPERS — strip PII before sending to AI ===
function redactName(fullName){
  if(!fullName)return'Client';
  const parts=fullName.trim().split(/\s+/);
  if(parts.length===1)return parts[0];
  return parts[0]+' '+parts.slice(1).map(p=&gt;p.charAt(0)+'xxx').join(' ');
}

function redactPII(text){
  if(!text)return'';
  let t=String(text);
  // Phone numbers (Australian format)
  t=t.replace(/(\+?61\s?|0)([2-9])\s?(\d{4})\s?(\d{4})/g,'$1$2 $3 xxx');
  t=t.replace(/(\+?61\s?|0)4(\d{2})\s?(\d{3})\s?(\d{3})/g,'04$2 xxx xxx');
  // Generic 10-digit phones
  t=t.replace(/\b(\d{4})\s?(\d{3})\s?(\d{3})\b/g,'$1 xxx xxx');
  // Email addresses — keep first 2 chars + domain
  t=t.replace(/([\w.-]{2})[\w.-]+@([\w.-]+)/g,'$1xxx@$2');
  // Bank account numbers (BSB-account format)
  t=t.replace(/\b\d{3}-?\d{3}\s+\d{4,9}\b/g,'xxx-xxx xxxxxx');
  // License/passport numbers (long alphanumeric)
  t=t.replace(/\b[A-Z0-9]{8,12}\b/g,function(m){
    // Don't redact common words like ABN, ACN
    if(/^(ABN|ACN|VIN|RWC|REGO)$/.test(m))return m;
    return m.substring(0,2)+'xxx';
  });
  // Medicare card (10 digits with /)
  t=t.replace(/\b\d{4}\s?\d{5}\s?\d\s?\/?\s?\d?\b/g,'xxxx xxxxx x');
  // Street addresses (number + street name pattern)
  t=t.replace(/\b\d{1,4}\s+[A-Z][a-z]+\s+(Street|St|Road|Rd|Avenue|Ave|Drive|Dr|Lane|Ln|Court|Ct|Place|Pl|Crescent|Cres|Way|Boulevard|Blvd)\b/gi,'xxx Street');
  return t;
}

// === STAR SIGN FROM DOB ===
function getStarSign(dob){
  if(!dob)return null;
  const d=new Date(dob);
  if(isNaN(d))return null;
  const m=d.getMonth()+1,day=d.getDate();
  const signs=[
    {sign:'Capricorn',start:[12,22],end:[1,19],traits:'practical, disciplined, ambitious, prefers structure and concrete plans'},
    {sign:'Aquarius',start:[1,20],end:[2,18],traits:'independent, intellectual, original, prefers logic over emotion'},
    {sign:'Pisces',start:[2,19],end:[3,20],traits:'empathetic, intuitive, sensitive, responds to warmth and personal connection'},
    {sign:'Aries',start:[3,21],end:[4,19],traits:'direct, energetic, impatient, wants quick decisions and action'},
    {sign:'Taurus',start:[4,20],end:[5,20],traits:'patient, methodical, stubborn, values reliability and detailed information'},
    {sign:'Gemini',start:[5,21],end:[6,20],traits:'curious, communicative, restless, prefers conversation and options'},
    {sign:'Cancer',start:[6,21],end:[7,22],traits:'caring, cautious, family-oriented, responds to empathy and reassurance'},
    {sign:'Leo',start:[7,23],end:[8,22],traits:'confident, expressive, proud, responds to recognition and respect'},
    {sign:'Virgo',start:[8,23],end:[9,22],traits:'analytical, detail-oriented, perfectionist, wants thoroughness and precision'},
    {sign:'Libra',start:[9,23],end:[10,22],traits:'diplomatic, fair-minded, indecisive, values balanced presentation of options'},
    {sign:'Scorpio',start:[10,23],end:[11,21],traits:'intense, perceptive, private, responds to honesty and depth'},
    {sign:'Sagittarius',start:[11,22],end:[12,21],traits:'optimistic, big-picture, freedom-loving, prefers high-level summaries'}
  ];
  for(const s of signs){
    const[sm,sd]=s.start,[em,ed]=s.end;
    if(sm===em){if(m===sm&amp;&amp;day&gt;=sd&amp;&amp;day&lt;=ed)return s}
    else if(m===sm&amp;&amp;day&gt;=sd)return s;
    else if(m===em&amp;&amp;day&lt;=ed)return s;
  }
  // Capricorn wraps year
  if((m===12&amp;&amp;day&gt;=22)||(m===1&amp;&amp;day&lt;=19))return signs[0];
  return null;
}

// === SELECT CLIENT ===
function selectClient(id){
  // Force fresh selection state — clear any stale references
  selectedId=String(id);
  const view=document.getElementById('clientView');
  view.innerHTML='';  // wipe stale DOM
  renderList();
  const c=clients.find(x=&gt;String(x.id)===String(id));
  if(!c){console.warn('Client not found:',id);return}
  const brain=getBrain(id)||{};
  document.getElementById('emptyState').style.display='none';
  view.style.display='block';

  const stage=c.stage||'New';
  const badgeClass={'New':'badge-new','Contacted':'badge-new','Qualified':'badge-qual','Submitted':'badge-sub','Approved':'badge-app','Settled':'badge-set','Lost':'badge-lost'}[stage]||'badge-new';
  const days=daysBetween(parseDate(c.receivedDate),new Date())||'?';
  const isClosed=stage==='Settled'||stage==='Lost';

  let html='&lt;div class=&quot;warn-bar&quot;&gt;⚠ Client Brain saved in browser only — export weekly as backup.&lt;/div&gt;';

  // Header
  html+='&lt;div class=&quot;client-header&quot;&gt;&lt;div&gt;&lt;div class=&quot;client-name&quot;&gt;'+esc(c.name)+'&lt;/div&gt;'
    +'&lt;div class=&quot;client-meta&quot;&gt;'
    +'&lt;span&gt;&lt;span class=&quot;badge-sm '+badgeClass+'&quot;&gt;'+esc(stage)+'&lt;/span&gt;&lt;/span&gt;'
    +(c.requested?'&lt;span&gt;💰 $'+Number(c.requested).toLocaleString()+'&lt;/span&gt;':'')
    +(c.product?'&lt;span&gt;🚗 '+esc(c.product)+'&lt;/span&gt;':'')
    +(c.lender?'&lt;span&gt;🏦 '+esc(c.lender)+'&lt;/span&gt;':'')
    +'&lt;span&gt;📅 Day '+days+' in pipeline&lt;/span&gt;'
    +'&lt;/div&gt;&lt;/div&gt;';
  // Build header actions
  let headerActions='';
  // Undo button — shows count of available undos
  const undoCount=getUndoCount(c.id);
  if(undoCount&gt;0){
    headerActions+='&lt;button class=&quot;btn btn-outline btn-sm&quot; style=&quot;border-color:rgba(244,112,103,.4);color:var(--neg)&quot; onclick=&quot;undoLastUpdate()&quot; title=&quot;Undo the most recent update&quot;&gt;↶ Undo ('+undoCount+' available)&lt;/button&gt;';
  }
  if(isClosed&amp;&amp;!brain.postmortem){
    headerActions+='&lt;button class=&quot;btn btn-purple&quot; onclick=&quot;generatePostmortem()&quot;&gt;🧠 Generate Post-Mortem&lt;/button&gt;';
  }else if(isClosed&amp;&amp;brain.postmortem){
    headerActions+='&lt;button class=&quot;btn btn-outline btn-sm&quot; onclick=&quot;generatePostmortem()&quot;&gt;↻ Regenerate Post-Mortem&lt;/button&gt;';
  }
  if(headerActions){html+='&lt;div class=&quot;client-actions&quot;&gt;'+headerActions+'&lt;/div&gt;';}
  html+='&lt;/div&gt;';

  // DOB input (manual — for star sign calc) — only if no DOB on client record AND none saved in brain
  if(!c.dob&amp;&amp;!brain.dob){
